<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sports">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<title>sports · rafa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3;--s1:#FFFFFF;--s2:#F0EEE9;--border:#E2DED6;--border-s:#C8C3BA;
  --text:#1A1916;--t2:#6B6760;--t3:#9B9690;
  --r:10px;--rs:6px;
  --gn:#15803d;--gn-bg:#dcfce7;--ro:#dc2626;--ro-bg:#fee2e2;--am:#d97706;--bl:#1d4ed8;
  --sw-c:#0369a1;--sw-bg:rgba(3,105,161,.11);
  --ru-c:#15803d;--ru-bg:rgba(21,128,61,.11);
  --st-c:#c2410c;--st-bg:rgba(194,65,12,.11);
  --ri-c:#7c3aed;--ri-bg:rgba(124,58,237,.11);
  --wa-c:#a16207;--wa-bg:rgba(161,98,7,.12);
  --track:#ECE9E3;
  --f-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412;--s1:#1E1D1A;--s2:#252320;--border:#2E2C28;--border-s:#3E3B36;
  --text:#F0EDE8;--t2:#A09C94;--t3:#6B6760;
  --gn:#86efac;--gn-bg:#052e16;--ro:#fca5a5;--ro-bg:#2a1215;--am:#fcd34d;--bl:#93c5fd;
  --sw-c:#7dd3fc;--sw-bg:rgba(125,211,252,.12);--ru-c:#86efac;--ru-bg:rgba(134,239,172,.12);--st-c:#fdba74;--st-bg:rgba(253,186,116,.12);
  --ri-c:#c4b5fd;--ri-bg:rgba(196,181,253,.12);--wa-c:#fde68a;--wa-bg:rgba(253,230,138,.12);
  --track:#2A2825;
}}
:root[data-theme="dark"]{
  --bg:#141412;--s1:#1E1D1A;--s2:#252320;--border:#2E2C28;--border-s:#3E3B36;
  --text:#F0EDE8;--t2:#A09C94;--t3:#6B6760;
  --gn:#86efac;--gn-bg:#052e16;--ro:#fca5a5;--ro-bg:#2a1215;--am:#fcd34d;--bl:#93c5fd;
  --sw-c:#7dd3fc;--sw-bg:rgba(125,211,252,.12);--ru-c:#86efac;--ru-bg:rgba(134,239,172,.12);--st-c:#fdba74;--st-bg:rgba(253,186,116,.12);
  --ri-c:#c4b5fd;--ri-bg:rgba(196,181,253,.12);--wa-c:#fde68a;--wa-bg:rgba(253,230,138,.12);
  --track:#2A2825;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.hdr{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px}
.back{display:inline-flex;align-items:center;font-size:13px;color:var(--t3);text-decoration:none;padding:4px 8px;border-radius:var(--rs);border:1px solid var(--border);flex-shrink:0}
.back:hover{color:var(--text);background:var(--s2)}
.hdr-title{font-family:var(--f-num);font-size:20px;font-weight:600;flex:1;letter-spacing:.01em}
.hdr-title span{color:var(--t3);font-weight:500}
.tbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border);border-radius:var(--rs);background:none;cursor:pointer;color:var(--t2);flex-shrink:0}
.tbtn:hover{background:var(--s2);color:var(--text)}
.tabsrow{max-width:760px;margin:0 auto;padding:10px 16px 0;overflow-x:auto}
.tabs{display:inline-flex;background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);padding:3px;gap:2px}
.tab{padding:5px 12px;border:1px solid transparent;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);background:transparent;white-space:nowrap}
.tab.on{background:var(--s1);color:var(--text);border-color:var(--border)}

#setup{max-width:400px;margin:4rem auto;padding:20px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r)}
#setup h2{font-size:16px;font-weight:600;margin-bottom:6px}
#setup p{color:var(--t2);font-size:14px;margin-bottom:14px}
#setup input{width:100%;padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px;margin-bottom:10px;font-family:inherit}
#setup button{width:100%;padding:9px;background:var(--text);border:none;border-radius:var(--rs);color:var(--bg);font-weight:600;cursor:pointer;font-size:14px}

.wrap{max-width:760px;margin:0 auto;padding:14px 16px 80px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ct{font-size:14px;font-weight:600}
.cs{font-size:13px;color:var(--t3)}
.empty{color:var(--t3);font-size:14px;padding:14px 0;text-align:center}
.err{color:var(--ro);font-size:13px;padding:12px 14px;background:var(--ro-bg);border-radius:var(--r);margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.kl{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px}
.kl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kv{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.ku{font-size:12px;color:var(--t3)}
.kd{font-size:12px;margin-top:2px;color:var(--t2)}
.up{color:var(--gn)}.down{color:var(--am)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg.ch-svg{width:100%;height:auto;display:block;overflow:visible}
.tk{fill:var(--t3);font-size:10px;font-family:var(--f-body)}
.gl{stroke:var(--border);stroke-width:1}
.det{font-size:13px;color:var(--t2);min-height:20px;margin-top:6px}
.det b{color:var(--text);font-weight:600}
.dot{cursor:pointer}
.tw{overflow:auto;max-height:420px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--s1);color:var(--t3);font-weight:500;font-size:12px}
th button{all:unset;cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.nm{white-space:normal;min-width:9rem}
.tag{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--s2);color:var(--t2)}
.srch{width:100%;max-width:260px;padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:inherit;font-size:13px}
.note{font-size:12px;color:var(--t3);margin-top:8px}
@media(max-width:520px){.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="setup" style="display:none">
  <h2>Conectar repositorio</h2>
  <p>Token de GitHub para leer los datos del repo privado. Se guarda solo en este navegador (el mismo que usa health).</p>
  <input type="password" id="tki" placeholder="github_pat_…" autocomplete="off">
  <button onclick="saveToken()">Conectar</button>
</div>
<div id="app" style="display:none">
  <div class="hdr"><div class="hdr-in">
    <a class="back" href="../" aria-label="Volver a dashboards">‹<span>&nbsp;dashboards</span></a>
    <div class="hdr-title">sports <span>rafa</span></div>
    <button class="tbtn" onclick="toggleTheme()" aria-label="Cambiar tema" id="themeBtn">◐</button>
  </div>
  <div class="tabsrow"><div class="tabs" role="tablist" id="tabs"></div></div></div>
  <div class="wrap"><div id="content"><div class="empty">Cargando…</div></div></div>
</div>
<script>
const REPO="rfleiro/FamilyOps",SPATH="sports/strava.json",HPATH="health/data.json";
const APRIL=["2026-04-01","2026-04-30"];
const SMAP={Swim:"swim",Run:"run",TrailRun:"run",VirtualRun:"run",WeightTraining:"strength",Workout:"strength",Crossfit:"strength",Yoga:"strength",Ride:"ride",VirtualRide:"ride",GravelRide:"ride",MountainBikeRide:"ride",EBikeRide:"ride",Walk:"walk",Hike:"walk"};
const TNAME={swim:"natación",run:"carrera",strength:"fuerza",ride:"bici",walk:"caminar"};
const TVAR={swim:"sw",run:"ru",strength:"st",ride:"ri",walk:"wa"};
const MAIN=["swim","run","strength"];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
let view="res",token=null,A=[],META={},LOGST={k:"date",d:-1,q:""};

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const dd=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ymd(new Date());
const n1=x=>x.toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1});
const n0=x=>Math.round(x).toLocaleString("es-ES");
const mmss=s=>{const t=Math.round(s);return Math.floor(t/60)+":"+pad(t%60);};
const fd=s=>{const d=pd(s);return d.getDate()+" "+MES[d.getMonth()];};
const hm=m=>{const h=Math.floor(m/60),r=Math.round(m%60);return h?h+" h "+pad(r)+" min":r+" min";};

/* theme */
function isDark(){const t=document.documentElement.dataset.theme;return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);}
function toggleTheme(){const n=isDark()?"light":"dark";document.documentElement.dataset.theme=n;localStorage.setItem("rh_theme",n);}
function initTheme(){const s=localStorage.getItem("rh_theme");if(s)document.documentElement.dataset.theme=s;}

/* boot / data */
function show(id){document.getElementById("setup").style.display=id==="setup"?"block":"none";document.getElementById("app").style.display=id==="app"?"block":"none";}
async function init(){initTheme();token=localStorage.getItem("rh_token");if(!token){show("setup");return;}show("app");buildTabs();await load();render();}
async function saveToken(){const t=document.getElementById("tki").value.trim();if(!t)return;localStorage.setItem("rh_token",t);token=t;show("app");buildTabs();await load();render();}
function b64utf8(b64){const bin=atob(b64.replace(/\n/g,""));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(b);}
async function getJSON(path){
  const res=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+path,{headers:{Authorization:"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});
  if(res.status===404)return null;
  if(!res.ok)throw new Error(res.status===401?"El token no es válido o ha caducado (401).":"GitHub respondió "+res.status+".");
  const j=await res.json();return JSON.parse(b64utf8(j.content));
}
function mk(a){
  const sport=SMAP[a.type]||a.type,km=(a.distance_m||0)/1000,min=(a.moving_s||0)/60;
  let pace=null;
  if(sport==="run"&&a.distance_m>0&&a.moving_s>0)pace=a.moving_s/a.distance_m*1000;
  if(sport==="swim"&&a.trainer&&a.distance_m>0&&a.moving_s>0)pace=a.moving_s/a.distance_m*100;
  return{id:a.id,date:a.date,time:a.time||"",name:a.name||TNAME[sport]||sport,sport,km,min,pace,elev:a.elev_m==null?null:a.elev_m,effort:a.effort==null?null:a.effort,kcal:a.kcal==null?null:a.kcal,hr:a.hr_avg==null?null:a.hr_avg,hrmax:a.hr_max==null?null:a.hr_max,manual:!!a.manual};
}
async function load(){
  const c=document.getElementById("content");
  try{
    const s=await getJSON(SPATH);
    if(!s)throw new Error("Aún no hay datos de Strava en el repo. Pídele a Claude: «sincroniza Strava en deporte».");
    META=s;A=(s.activities||[]).map(mk);
    try{ /* sesiones manuales de health (casa, caminatas…) que no están en Strava */
      const h=await getJSON(HPATH);
      ((h&&h.entries)||[]).forEach(e=>(e.activities||[]).forEach((x,i)=>{
        if(x.strava_id)return;
        A.push(mk({id:"m"+e.date+"-"+i,date:e.date,name:x.label,type:x.type,distance_m:x.distance_m,moving_s:(x.duration_min||0)*60,kcal:x.kcal_out,manual:true}));
      }));
    }catch(e){console.warn("health no disponible",e);}
    A.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  }catch(e){
    console.error(e);A=[];
    c.innerHTML='<div class="err">No se pudieron cargar los datos. '+esc(e.message)+'<br><a href="#" onclick="localStorage.removeItem(\'rh_token\');location.reload()">Conectar con otro token</a></div>';
    throw e;
  }
}

/* aggregates */
function win(from,to,sport){let n=0,m=0,k=0;A.forEach(a=>{if(a.sport===sport&&a.date>=from&&a.date<=to){n++;m+=a.min;k+=a.km;}});return{n,h:m/60,km:k};}
function delta(cur,base){if(!(base>0))return"";const p=(cur-base)/base,c=p>=0?"up":"down";return'<span class="'+c+'">'+(p>=0?"+":"−")+Math.abs(Math.round(p*100))+"% vs abril</span>";}
function kpis(){
  const t=today(),from=ymd(addD(pd(t),-27));
  const unit={swim:["km","km"],run:["km","km"],strength:["h","h"]};
  return'<div class="g3">'+MAIN.map(s=>{
    const c=win(from,t,s),b=win(APRIL[0],APRIL[1],s);
    const cv=(s==="strength"?c.h:c.km)/4,bv=(s==="strength"?b.h:b.km)/(30/7);
    return'<div class="kpi"><div class="kl"><i style="background:var(--'+TVAR[s]+'-c)"></i>'+TNAME[s]+'</div><div class="kv">'+n1(cv)+'</div><div class="ku">'+unit[s][0]+' por semana · últimos 28 días</div><div class="kd">abril: '+n1(bv)+' · '+delta(cv,bv)+'</div></div>';
  }).join("")+'</div>';
}

/* charts */
function weeklyChart(){
  if(!A.length)return"";
  const first=monday(pd(A[A.length-1].date)),last=monday(new Date()),W=[];
  for(let w=first;w<=last;w=addD(w,7)){const k=ymd(w),T={swim:0,run:0,strength:0,other:0};A.forEach(a=>{if(a.date>=k&&a.date<=ymd(addD(w,6)))T[MAIN.includes(a.sport)?a.sport:"other"]+=a.min/60;});W.push({k,T,tot:T.swim+T.run+T.strength});}
  const Wd=640,H=170,l=28,b=20,t=6,r=4,mx=Math.max(2,Math.ceil(Math.max(...W.map(x=>x.tot))));
  const bw=(Wd-l-r)/W.length,y=v=>H-b-(H-b-t)*v/mx;
  let s='<svg class="ch-svg" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Horas por semana">';
  for(let v=0;v<=mx;v+=mx>6?2:1)s+='<line class="gl" x1="'+l+'" x2="'+(Wd-r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tk" x="'+(l-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+' h</text>';
  W.forEach((w,i)=>{
    let acc=0;const x=l+i*bw;
    MAIN.forEach(sp=>{const v=w.T[sp];if(v>0){s+='<rect x="'+(x+bw*.15)+'" y="'+y(acc+v)+'" width="'+(bw*.7)+'" height="'+(y(acc)-y(acc+v))+'" rx="2" fill="var(--'+TVAR[sp]+'-c)"/>';acc+=v;}});
    s+='<rect x="'+x+'" y="'+t+'" width="'+bw+'" height="'+(H-b-t)+'" fill="transparent" style="cursor:pointer" onclick="selWeek('+i+')" onmouseenter="selWeek('+i+')"/>';
    const d=pd(w.k);if(d.getDate()<=7)s+='<text class="tk" x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle">'+MES[d.getMonth()]+'</text>';
  });
  window._W=W;
  return s+'</svg>';
}
function selWeek(i){
  const w=window._W[i],e=ymd(addD(pd(w.k),6)),L=[];
  A.filter(a=>a.date>=w.k&&a.date<=e).sort((a,b)=>a.date.localeCompare(b.date)).forEach(a=>L.push(fd(a.date)+" · "+esc(a.name)+" ("+hm(a.min)+(a.km>0?", "+n1(a.km)+" km":"")+")"));
  document.getElementById("wdet").innerHTML='<b>Semana del '+fd(w.k)+'</b> · '+n1(w.tot)+' h'+(L.length?'<br>'+L.join('<br>'):' · sin sesiones');
}
function monthlyChart(){
  if(!A.length)return"";
  const f=pd(A[A.length-1].date),now=new Date(),M=[];
  for(let y=f.getFullYear(),m=f.getMonth();y<now.getFullYear()||(y===now.getFullYear()&&m<=now.getMonth());){
    const p=y+"-"+pad(m+1),T={swim:0,run:0};A.forEach(a=>{if(a.date.slice(0,7)===p&&T[a.sport]!==undefined)T[a.sport]+=a.km;});M.push({m,p,T});
    if(++m>11){m=0;y++;}
  }
  const Wd=640,H=170,l=34,b=20,t=14,r=4,mx=Math.max(10,Math.ceil(Math.max(...M.map(x=>Math.max(x.T.swim,x.T.run)))/10)*10),y=v=>H-b-(H-b-t)*v/mx,bw=(Wd-l-r)/M.length;
  let s='<svg class="ch-svg" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Km por mes">';
  [0,mx/2,mx].forEach(v=>s+='<line class="gl" x1="'+l+'" x2="'+(Wd-r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tk" x="'+(l-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+' km</text>');
  M.forEach((o,i)=>{
    const x=l+i*bw,w=bw*.32;
    ["swim","run"].forEach((sp,j)=>{const v=o.T[sp],xx=x+bw*.15+j*(w+2);s+='<rect x="'+xx+'" y="'+y(v)+'" width="'+w+'" height="'+(y(0)-y(v))+'" rx="2" fill="var(--'+TVAR[sp]+'-c)"><title>'+TNAME[sp]+" "+MES[o.m]+": "+n1(v)+' km</title></rect>';if(v>0)s+='<text class="tk" x="'+(xx+w/2)+'" y="'+(y(v)-3)+'" text-anchor="middle">'+n0(v)+'</text>';});
    s+='<text class="tk" x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle">'+MES[o.m]+'</text>';
  });
  return s+'</svg>';
}
function dotChart(rows,id,sport){
  /* ritmo por sesión: más rápido arriba; el radio es la distancia */
  const R=rows.filter(a=>a.pace).sort((a,b)=>a.date.localeCompare(b.date));
  if(R.length<2)return'<div class="empty">Aún no hay suficientes sesiones con ritmo.</div>';
  const Wd=640,H=200,l=40,b=20,t=8,r=10,x0=pd(R[0].date).getTime(),x1=pd(R[R.length-1].date).getTime()||x0+1;
  const lo=Math.min(...R.map(a=>a.pace))*.97,hi=Math.max(...R.map(a=>a.pace))*1.03,mk2=Math.max(...R.map(a=>a.km))||1;
  const X=d=>l+8+(Wd-l-r-16)*(pd(d).getTime()-x0)/Math.max(1,x1-x0),Y=p=>t+(H-b-t)*(p-lo)/(hi-lo);
  let s='<svg class="ch-svg" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Ritmo por sesión">';
  for(let i=0;i<=3;i++){const p=lo+(hi-lo)*i/3;s+='<line class="gl" x1="'+l+'" x2="'+(Wd-r)+'" y1="'+Y(p)+'" y2="'+Y(p)+'"/><text class="tk" x="'+(l-5)+'" y="'+(Y(p)+3)+'" text-anchor="end">'+mmss(p)+'</text>';}
  s+='<polyline fill="none" stroke="var(--'+TVAR[sport]+'-c)" stroke-width="2" stroke-opacity=".4" stroke-linejoin="round" points="'+R.map(a=>X(a.date)+","+Y(a.pace)).join(" ")+'"/>';
  R.forEach(a=>{s+='<circle class="dot" cx="'+X(a.date)+'" cy="'+Y(a.pace)+'" r="'+(3+6*Math.sqrt(a.km/mk2))+'" fill="var(--'+TVAR[sport]+'-c)" fill-opacity=".85" onclick="selDot(\''+id+'\',\''+a.id+'\')" onmouseenter="selDot(\''+id+'\',\''+a.id+'\')"/>';});
  const seen={};R.forEach(a=>{const k=a.date.slice(0,7);if(!seen[k]){seen[k]=1;s+='<text class="tk" x="'+X(a.date)+'" y="'+(H-5)+'" text-anchor="middle">'+MES[pd(a.date).getMonth()]+'</text>';}});
  return s+'</svg>';
}
function selDot(id,aid){
  const a=A.find(x=>x.id===aid);if(!a)return;
  document.getElementById(id).innerHTML='<b>'+fd(a.date)+' · '+esc(a.name)+'</b><br>'+[n1(a.km)+" km",hm(a.min),mmss(a.pace)+(a.sport==="swim"?" /100 m":" /km"),a.hr?"FC "+n0(a.hr)+(a.hrmax?" (máx "+n0(a.hrmax)+")":""):"",a.effort!=null?"esfuerzo "+n0(a.effort):""].filter(Boolean).join(" · ");
}
function hrChart(){
  const R=A.filter(a=>a.sport==="run"&&a.pace&&a.hr);
  if(R.length<2)return'<div class="empty">Falta el pulso de las carreras. Pídele a Claude «sincroniza Strava en deporte» para completarlo.</div>';
  const Wd=640,H=200,l=40,b=22,t=8,r=10,xl=Math.min(...R.map(a=>a.pace))*.97,xh=Math.max(...R.map(a=>a.pace))*1.03,yl=Math.min(...R.map(a=>a.hr))-5,yh=Math.max(...R.map(a=>a.hr))+5;
  const X=p=>l+8+(Wd-l-r-16)*(xh-p)/(xh-xl),Y=h=>H-b-(H-b-t)*(h-yl)/(yh-yl);
  let s='<svg class="ch-svg" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Pulso frente a ritmo">';
  for(let i=0;i<=3;i++){const h=yl+(yh-yl)*i/3;s+='<line class="gl" x1="'+l+'" x2="'+(Wd-r)+'" y1="'+Y(h)+'" y2="'+Y(h)+'"/><text class="tk" x="'+(l-5)+'" y="'+(Y(h)+3)+'" text-anchor="end">'+n0(h)+'</text>';}
  for(let i=0;i<=3;i++){const p=xh-(xh-xl)*i/3;s+='<text class="tk" x="'+X(p)+'" y="'+(H-6)+'" text-anchor="middle">'+mmss(p)+'</text>';}
  R.forEach(a=>{s+='<circle class="dot" cx="'+X(a.pace)+'" cy="'+Y(a.hr)+'" r="5" fill="var(--ru-c)" fill-opacity=".85" onclick="selDot(\'hdet\',\''+a.id+'\')" onmouseenter="selDot(\'hdet\',\''+a.id+'\')"/>';});
  return s+'</svg>';
}

/* tables */
function chip(sp){return'<span class="tag" style="color:var(--'+TVAR[sp]+'-c);background:var(--'+TVAR[sp]+'-bg)">'+TNAME[sp]+'</span>';}
function table(rows,cols,sortable){
  const st=LOGST;
  let h='<table><thead><tr>'+cols.map(c=>'<th class="'+(c.n?"n":"")+'">'+(sortable?'<button onclick="sortLog(\''+c.k+'\')">'+c.l+(st.k===c.k?(st.d>0?" ↑":" ↓"):"")+'</button>':c.l)+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(a=>{h+='<tr>'+cols.map(c=>'<td class="'+(c.n?"n ":"")+(c.k==="name"?"nm":"")+'">'+c.f(a)+'</td>').join("")+'</tr>';});
  return h+'</tbody></table>';
}
const C={
  date:{k:"date",l:"Fecha",f:a=>fd(a.date)},
  name:{k:"name",l:"Actividad",f:a=>esc(a.name)+(a.manual?' <span class="tag">manual</span>':"")},
  sport:{k:"sport",l:"Tipo",f:a=>chip(a.sport)},
  km:{k:"km",l:"km",n:1,f:a=>a.km>0?n1(a.km):""},
  min:{k:"min",l:"Tiempo",n:1,f:a=>hm(a.min)},
  pace:{k:"pace",l:"Ritmo",n:1,f:a=>a.pace?mmss(a.pace)+(a.sport==="swim"?" /100m":" /km"):""},
  hr:{k:"hr",l:"FC",n:1,f:a=>a.hr?n0(a.hr):""},
  effort:{k:"effort",l:"Esf.",n:1,f:a=>a.effort==null?"":n0(a.effort)},
  kcal:{k:"kcal",l:"kcal",n:1,f:a=>a.kcal==null?"":n0(a.kcal)}
};
function sortLog(k){if(LOGST.k===k)LOGST.d=-LOGST.d;else{LOGST.k=k;LOGST.d=(k==="name"||k==="sport")?1:-1;}renderLog();}
function renderLog(){
  const q=LOGST.q,rows=A.filter(a=>!q||(a.name+" "+TNAME[a.sport]+" "+a.date).toLowerCase().includes(q)).sort((a,b)=>{
    const x=a[LOGST.k],y=b[LOGST.k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(x<y?-1:x>y?1:0)*LOGST.d;});
  document.getElementById("logt").innerHTML=table(rows,[C.date,C.name,C.sport,C.km,C.min,C.pace,C.hr,C.effort,C.kcal],true);
}
function onSearch(v){LOGST.q=v.trim().toLowerCase();renderLog();}

/* views */
function sportView(sp){
  const R=A.filter(a=>a.sport===sp),t=today(),from=ymd(addD(pd(t),-27)),c=win(from,t,sp),tot=R.reduce((s,a)=>s+a.km,0);
  const best=R.filter(a=>a.pace).sort((a,b)=>a.pace-b.pace)[0];
  let h='<div class="g3"><div class="kpi"><div class="kl">sesiones · 28 días</div><div class="kv">'+c.n+'</div><div class="ku">'+n1(c.km)+' km</div></div>'
   +'<div class="kpi"><div class="kl">total desde marzo</div><div class="kv">'+n0(tot)+'</div><div class="ku">km · '+R.length+' sesiones</div></div>'
   +'<div class="kpi"><div class="kl">mejor ritmo</div><div class="kv">'+(best?mmss(best.pace):"—")+'</div><div class="ku">'+(sp==="swim"?"/100 m":"/km")+(best?" · "+fd(best.date):"")+'</div></div></div>';
  h+='<div class="card"><div class="ch"><div class="ct">Ritmo por sesión</div><div class="cs">más rápido arriba · tamaño = distancia</div></div>'+dotChart(R,"pdet",sp)+'<div class="det" id="pdet">Toca un punto para ver la sesión.</div></div>';
  if(sp==="run")h+='<div class="card"><div class="ch"><div class="ct">Pulso medio frente a ritmo</div><div class="cs">más a la derecha = más rápido</div></div>'+hrChart()+'<div class="det" id="hdet">Cada punto es una carrera con pulso.</div></div>';
  h+='<div class="card"><div class="ch"><div class="ct">Sesiones</div></div><div class="tw">'+table(R,[C.date,C.name,C.km,C.min,C.pace,C.hr,C.effort,C.kcal],false)+'</div>'+(sp==="swim"?'<div class="note">Una natación manual (p. ej. liga) no tiene ritmo: Strava no guarda tiempo en movimiento.</div>':"")+'</div>';
  return h;
}
function strengthView(){
  const R=A.filter(a=>a.sport==="strength"),t=today(),last=R[0];
  const wk={};R.forEach(a=>{const k=ymd(monday(pd(a.date)));wk[k]=(wk[k]||0)+1;});
  const days=last?dd(last.date,t):null;
  let h='<div class="g3"><div class="kpi"><div class="kl"><i style="background:var(--st-c)"></i>última sesión</div><div class="kv">'+(days==null?"—":days)+'</div><div class="ku">días'+(last?" · "+fd(last.date):"")+'</div></div>'
   +'<div class="kpi"><div class="kl">sesiones · 28 días</div><div class="kv">'+win(ymd(addD(pd(t),-27)),t,"strength").n+'</div><div class="ku">objetivo: proteger la zona lumbar</div></div>'
   +'<div class="kpi"><div class="kl">total desde marzo</div><div class="kv">'+R.length+'</div><div class="ku">'+n1(R.reduce((s,a)=>s+a.min,0)/60)+' h</div></div></div>';
  h+='<div class="card"><div class="ch"><div class="ct">Registro de fuerza</div><div class="cs">Strava + sesiones manuales de health</div></div><div class="tw">'+(R.length?table(R,[C.date,C.name,C.min,C.effort,C.kcal],false):'<div class="empty">Sin sesiones de fuerza.</div>')+'</div></div>';
  return h;
}
function render(){
  const c=document.getElementById("content");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(!A.length){c.innerHTML='<div class="empty">Sin actividades todavía.</div>';return;}
  let h="";
  if(view==="res"){
    const upd=META.updated?'<div class="note">Datos de Strava sincronizados el '+esc(META.updated.slice(0,10))+'. Pídele a Claude «sincroniza Strava en deporte» para actualizar.</div>':"";
    h=kpis()
     +'<div class="card"><div class="ch"><div class="ct">Horas por semana</div><div class="cs">lunes a domingo</div></div><div class="legend">'+MAIN.map(s=>'<span><i style="background:var(--'+TVAR[s]+'-c)"></i>'+TNAME[s]+'</span>').join("")+'</div>'+weeklyChart()+'<div class="det" id="wdet">Toca una semana para ver sus sesiones.</div></div>'
     +'<div class="card"><div class="ch"><div class="ct">Km por mes</div><div class="cs">natación y carrera</div></div><div class="legend"><span><i style="background:var(--sw-c)"></i>natación</span><span><i style="background:var(--ru-c)"></i>carrera</span></div>'+monthlyChart()+'</div>'+upd;
  }else if(view==="swim")h=sportView("swim");
  else if(view==="run")h=sportView("run");
  else if(view==="strength")h=strengthView();
  else h='<div class="card"><div class="ch"><div class="ct">Todas las actividades</div><input class="srch" type="search" placeholder="Buscar…" oninput="onSearch(this.value)" aria-label="Buscar"></div><div class="tw" id="logt"></div></div>';
  c.innerHTML=h;
  if(view==="log")renderLog();
  if(view==="res"&&window._W&&window._W.length)selWeek(window._W.length-1);
}
function buildTabs(){
  const T=[["res","resumen"],["swim","natación"],["run","carrera"],["strength","fuerza"],["log","registro"]];
  document.getElementById("tabs").innerHTML=T.map(t=>'<button class="tab" data-v="'+t[0]+'" onclick="setView(\''+t[0]+'\')">'+t[1]+'</button>').join("");
}
function setView(v){view=v;render();}
init().catch(()=>{});
</script>
</body>
</html>
