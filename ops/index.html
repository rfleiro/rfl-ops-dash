<div id="app"></div>

<script src="../shared/core.js?v=20260910-1115"></script>
<script>
// ─── ops dashboard manifest ───────────────────────────────────────────────────
// Everything specific to this dashboard lives here. The engine is shared.
DashCore.start({
  id:        "ops",
  title:     "RFL",
  briefPath:   "brief/ops/today.json",
  changesPath: "brief/ops/today_changes.json",

  topics: ["admin","lab","IT","project","paper","grant","talk","review","patents"],

  topicColors: {
    project:{bg:"#E1F5EE",tx:"#0F6E56"}, paper:{bg:"#EEEDFE",tx:"#534AB7"},
    grant:{bg:"#FAEEDA",tx:"#854F0B"},   talk:{bg:"#FBEAF0",tx:"#993556"},
    review:{bg:"#E6F1FB",tx:"#185FA5"},  IT:{bg:"#F1EFE8",tx:"#5F5E5A"},
    admin:{bg:"#FAECE7",tx:"#993C1D"},   lab:{bg:"#EAF3DE",tx:"#3B6D11"},
    patents:{bg:"#F4C0D1",tx:"#72243E"},
    "people:lab":{bg:"#E1F5EE",tx:"#0F6E56"},
    "people:alumni":{bg:"#F1EFE8",tx:"#5F5E5A"},
    "people:networking":{bg:"#EEEDFE",tx:"#534AB7"}
  },

  sections: [
    { label:"Projects & threads", filter: i => i.type === "thread" },
    { label:"Tasks",              filter: i => i.type === "task",   allowNew:true },
    { label:"People",             filter: i => i.type === "person" }
  ],

  inbox:     true,
  braindump: true,
  dateField: { default:"Reminder", person:"Reminder" }
});
</script>
