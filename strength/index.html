<style>
:root{
  --bg:#F7F6F3;--s1:#FFFFFF;--s2:#F0EEE9;--border:#E2DED6;--border-s:#C8C3BA;
  --text:#1A1916;--t2:#6B6760;--t3:#9B9690;
  --r:10px;--rs:6px;
  --gn:#15803d;--gn-bg:#dcfce7;--ro:#dc2626;--ro-bg:#fee2e2;--am:#d97706;--bl:#1d4ed8;
  --sw-c:#0369a1;--sw-bg:rgba(3,105,161,.11);
  --ru-c:#15803d;--ru-bg:rgba(21,128,61,.11);
  --st-c:#c2410c;--st-bg:rgba(194,65,12,.11);
  --wa-c:#a16207;--wa-bg:rgba(161,98,7,.12);
  --track:#ECE9E3;
  --f-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412;--s1:#1E1D1A;--s2:#252320;--border:#2E2C28;--border-s:#3E3B36;
  --text:#F0EDE8;--t2:#A09C94;--t3:#6B6760;
  --gn:#86efac;--gn-bg:#052e16;--ro:#fca5a5;--ro-bg:#2a1215;--am:#fcd34d;--bl:#93c5fd;
  --sw-c:#7dd3fc;--sw-bg:rgba(125,211,252,.12);--ru-c:#86efac;--ru-bg:rgba(134,239,172,.12);--st-c:#fdba74;--st-bg:rgba(253,186,116,.12);
  --wa-c:#fde68a;--wa-bg:rgba(253,230,138,.12);--track:#2A2825;
}}
:root[data-theme="dark"]{
  --bg:#141412;--s1:#1E1D1A;--s2:#252320;--border:#2E2C28;--border-s:#3E3B36;
  --text:#F0EDE8;--t2:#A09C94;--t3:#6B6760;
  --gn:#86efac;--gn-bg:#052e16;--ro:#fca5a5;--ro-bg:#2a1215;--am:#fcd34d;--bl:#93c5fd;
  --sw-c:#7dd3fc;--sw-bg:rgba(125,211,252,.12);--ru-c:#86efac;--ru-bg:rgba(134,239,172,.12);--st-c:#fdba74;--st-bg:rgba(253,186,116,.12);
  --wa-c:#fde68a;--wa-bg:rgba(253,230,138,.12);--track:#2A2825;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px);touch-action:manipulation}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.hdr{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px}
.back{display:inline-flex;align-items:center;font-size:13px;color:var(--t3);text-decoration:none;padding:4px 8px;border-radius:var(--rs);border:1px solid var(--border);flex-shrink:0}
.hdr-title{font-family:var(--f-num);font-size:20px;font-weight:600;flex:1;letter-spacing:.01em}
.hdr-title span{color:var(--t3);font-weight:500}
.tbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border);border-radius:var(--rs);background:none;color:var(--t2)}

.wrap{max-width:620px;margin:0 auto;padding:14px 16px 80px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.ct{font-size:15px;font-weight:600}
.cs{font-size:13px;color:var(--t3)}
.note{font-size:13px;color:var(--t2);margin-top:10px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{padding:12px 8px;min-height:46px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s1);font-weight:500;text-align:center}
.opt.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.times{display:flex;gap:6px;align-items:stretch}
.times .opt{flex:1;min-width:0;padding:12px 4px}
.times input{width:76px;flex-shrink:0;padding:0 8px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);text-align:center}
.eqrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border:1px solid var(--border);border-radius:99px;font-size:13px;background:var(--s1);color:var(--t2)}
.chip.on{background:var(--st-bg);color:var(--st-c);border-color:var(--st-c)}
.chip.ro{cursor:default}
.lnk{background:none;border:none;color:var(--bl);font-size:13px;padding:4px 2px;white-space:nowrap}
.ed{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.ed textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);resize:vertical}
.pain{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pn{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px;min-height:46px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s1);text-align:left;font-size:14px}
.pn small{font-size:12px;color:var(--t3)}
.pn.l1{border-color:var(--am);background:var(--wa-bg)}.pn.l1 small{color:var(--wa-c)}
.pn.l2{border-color:var(--ro);background:var(--ro-bg)}.pn.l2 small{color:var(--ro)}
.go{display:block;width:100%;padding:15px;margin-top:4px;background:var(--text);color:var(--bg);border:none;border-radius:var(--r);font-size:16px;font-weight:600}
.go.alt{background:var(--s1);color:var(--text);border:1px solid var(--border-s);font-weight:500;margin-top:8px}
.warn{padding:12px 14px;border-radius:var(--r);margin-bottom:10px;font-size:14px}
.warn.a{background:var(--wa-bg);color:var(--text);border:1px solid var(--am)}
.warn.n{background:var(--s2);border:1px solid var(--border);color:var(--t2)}
.warn .lnk{display:inline;padding:0 0 0 6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.warn.r{background:var(--ro-bg);color:var(--text);border:1px solid var(--ro)}
.blk{margin-bottom:10px}
.blk .bh{font-size:13px;color:var(--t3);margin:0 2px 6px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.ex:first-of-type{border-top:none;padding-top:0}
.ex-b{flex:1;min-width:0}
.ex-t{font-weight:600}
.ex-s{font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--st-c)}
.ex-c{font-size:13px;color:var(--t2)}
.sw{flex-shrink:0;padding:6px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);font-size:13px;color:var(--t2)}
.sum{font-size:14px;color:var(--t2);margin-bottom:10px}

.run{display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 120px)}
.ph{align-self:center;font-size:13px;font-weight:600;padding:3px 12px;border-radius:99px}
.ph.main{background:var(--st-bg);color:var(--st-c)}
.ph.rest{background:var(--sw-bg);color:var(--sw-c)}
.ph.warm,.ph.cool,.ph.prep,.ph.switch{background:var(--ru-bg);color:var(--ru-c)}
.pbar{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--st-c);width:0}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.rn{font-size:26px;font-weight:600;line-height:1.15}
.sub{font-size:15px;color:var(--t2)}
.big{font-family:var(--f-num);font-weight:700;font-size:clamp(100px,34vw,180px);line-height:1;font-variant-numeric:tabular-nums}
.cue{font-size:15px;color:var(--t2);max-width:30em;margin-top:6px}
.up{font-size:14px;color:var(--t3);text-align:center}
.ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.cb{min-height:58px;padding:10px 6px;border:1px solid var(--border-s);border-radius:var(--r);background:var(--s1);font-weight:500}
.cb.pri{background:var(--text);color:var(--bg);border-color:var(--text);font-size:18px;font-weight:600}
.ctl2{display:flex;justify-content:space-between}
.kv{font-size:84px;font-weight:700;line-height:1;text-align:center}
.ku{text-align:center;color:var(--t2);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<div class="hdr"><div class="hdr-in"><a class="back" href="../">‹ Inicio</a><div class="hdr-title">fuerza <span>generador</span></div><button class="tbtn" onclick="toggleTheme()" aria-label="Cambiar tema">◐</button></div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===================== datos y lógica ===================== */
const AREAS=[["lumbar","Lumbar","l"],["hombro","Hombro","s"],["rodilla","Rodilla","k"],["cadera","Cadera","h"],["aquiles","Aquiles","a"],["cuello","Cuello","n"],["codo","Codo o muñeca","e"]];
const EQ=[["mat","Esterilla"],["band","Gomas largas"],["mini","Gomas cortas"],["open","Gomas abiertas"],["db","Mancuernas"],["kb","Kettlebell"],["bench","Banco"],["roman","Banco romano"],["step","Escalón"],["box","Cajón pliométrico"],["pullup","Barra de dominadas"],["trx","TRX"],["rope","Cuerda de saltar"],["outdoor","Calle o exterior"],["cable","Poleas"]];
const KW={
  mat:/esterilla|colchoneta|\bmat\b/i,
  mini:/(goma|banda)s? cortas?|mini ?bandas?/i,
  open:/(goma|banda)s? abiertas?|tubing/i,
  band:/(goma|banda)s? largas?|(goma|banda)s? (de )?resistencia|\b(goma|banda)s?\b(?! (corta|abierta))/i,
  db:/mancuerna|dumbbell|\bpesas\b/i,
  kb:/kettle ?ball|pesa rusa|\bkb\b/i,
  bench:/\bbanco\b(?! romano)|\bbench/i,
  roman:/banco romano|hiperextens/i,
  step:/esc[aá]l[oó]n|\bstep\b|caj[oó]n|silla|\bbanco\b(?! romano)|\bbench/i,
  box:/caj[oó]n|\bbox\b|pliom[eé]tric/i,
  pullup:/dominada|pull-?up|chin-?up|barra fija/i,
  trx:/\btrx\b|\btls\b|suspensi[oó]n|anillas|rings|cintas/i,
  rope:/cuerda|comba|skipping|saltar/i,
  outdoor:/calle|cuesta|cemento|exterior|pista/i,
  cable:/polea|\bcable|jal[oó]n|crossover/i
};
const ALLEQ=EQ.map(e=>e[0]);
function detect(t){return ALLEQ.filter(k=>KW[k].test(t||""));}
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const DEFSITES={
  home:{n:"Casa (Coruña)",d:"Calle de 15 m para correr con cuesta suave (cemento), cajón pliométrico, barra de dominadas, TRX, gomas cortas (rodillas, tobillos), gomas largas (columna o barra alta), gomas abiertas (gestos de nadador), cuerda de saltar, kettlebell de 10 kg, mancuernas de 2 y 5 kg, banco romano y esterilla.",t:["mat","band","mini","open","db","kb","roman","step","box","pullup","trx","rope","outdoor"]},
  madrid:{n:"Madrid",d:"Una mancuerna, kettlebell y esterilla.",t:["mat","db","kb"]},
  gym:{n:"Gimnasio",d:"Gimnasio: mancuernas, kettlebells, banco, escalón, poleas, TRX, barra de dominadas y gomas.",t:["mat","band","mini","db","kb","bench","step","pullup","trx","cable"]}
};
const SV=2;
if(LS.get("st_sv",0)<SV){LS.set("st_sites",{});LS.set("st_sv",SV);}
const SITES=Object.assign({},DEFSITES,LS.get("st_sites",{}));

/* Biblioteca de FamilyOps/fitness/rafa/strength/library.md (fase 1) + extras marcados con x:1.
   Estrés por zona: 0 no carga, 1 carga suave, 2 carga notable.
   Con molestia solo se admite estrés 0-1 en esa zona; con dolor, solo 0.
   Claves: l lumbar, s hombro, k rodilla, h cadera, a aquiles, n cuello, e codo o muñeca. */
function parseSt(s){const o={};(s||"").split(" ").forEach(p=>{if(p)o[p[0]]=+p.slice(1);});return o;}
function parseEq(s){return s?s.split("|").map(a=>a.split("+")):[[]];}
const LIB=[],WARM=[],COOL=[];
function X(id,name,pil,eq,mode,sets,val,rest,st,cue,o){
  LIB.push(Object.assign({id,name,pil,eq:parseEq(eq),mode,sets,val,rest,st:parseSt(st),cue},o||{}));
}
function T(list,pil,id,name,secs,eq,st,cue,uni,f){
  list.push({id,name,pil,eq:parseEq(eq),mode:"t",sets:1,val:secs,rest:0,st:parseSt(st),cue,uni:!!uni,f:f||"*"});
}
/* core */
X("deadbug","Dead bug","core","","r",3,8,40,"l0","Lumbar pegada al suelo todo el rato y exhala al extender. Lento, 3 s por repetición. Si se despega, acorta el rango.",{alt:1,w:2});
X("birddog","Bird-dog","core","","r",3,6,40,"l1 s1","Cadera cuadrada al suelo, sin arquear. Alarga, no subas. Pausa de 3 s arriba.",{alt:1});
X("pallof","Press Pallof con goma","core","band|cable","r",3,10,40,"l0","Goma anclada a la columna o a la barra. Costillas abajo y glúteos activos: el tronco no gira. Pausa de 2 s con los brazos estirados.",{uni:1,w:1.5});
X("hollow","Hollow body","core","","t",3,22,40,"l1 h1","Lumbar pegada al suelo. Si se despega, sube las piernas o flexiona las rodillas.");
X("plank","Plancha frontal","core","","t",3,35,40,"l1 s1 e1","Glúteos apretados, pelvis en retroversión suave y sin hundir la cadera.");
X("sideplank","Plancha lateral","core","","t",3,25,40,"l1 s1 h1","Línea recta hombro-cadera-tobillo. Con las rodillas apoyadas si hace falta.",{uni:1});
X("suitcase","Suitcase carry (isométrico)","core","kb|db","t",3,30,45,"l1","No te inclines hacia ningún lado y mantén los hombros nivelados.",{uni:1});
X("fallout","TRX fallout","core","trx","r",3,8,60,"l2 s1","Solo hasta donde mantienes la lumbar neutra. Rango corto: es exigente, empieza conservador.",{w:.35});
X("romanext","Extensión en banco romano","core","roman","r",2,10,60,"l2","Sin peso y controlado. Mueve la cadera con la columna neutra, sube solo hasta la línea del cuerpo y nunca hiperextiendas. Si notas molestia, reduce el rango o sáltatelo hoy.",{w:.45});
/* tirón */
X("assistpu","Dominada asistida con goma","pullv","pullup+band","r",4,5,90,"s2 e1","Escápulas abajo y atrás al empezar. Sin balanceo y baja controlado.");
X("hang","Colgarse de la barra","pullv","pullup","t",3,25,45,"s1 e1","Hombros activos, sin encoger. Si prefieres, 8 retracciones escapulares en vez de colgarte.");
X("trxrow","TRX row","pullh","trx","r",3,10,60,"s1 e1","Cuerpo en tabla con glúteos y core activos, codos pegados. Tira con la espalda.");
X("dbrow","Remo con mancuerna a una mano","pullh","db|kb","r",3,10,60,"l1 e1","Espalda neutra y apoyada (banco, silla o cama). Lleva el codo hacia la cadera.",{uni:1});
X("bandrow","Remo con goma","pullh","band","r",3,15,40,"l1","Codos pegados y escápulas juntas al final.");
X("pullover","Pullover con mancuerna en el suelo","pullh","db","r",3,10,50,"s1","Tumbado en el suelo, no en banco, para que la lumbar quede apoyada. Costillas abajo y peso ligero.");
X("kbrow","Remo con kettlebell inclinado","pullh","kb","r",3,10,60,"l2 e1","Bisagra de cadera con espalda neutra. Si la lumbar se carga, vuelve al remo con apoyo.",{uni:1});
X("facepull","Face pull con goma","prehab","band|cable","r",3,15,40,"","Codos altos. Complementa la brazada y protege el hombro.");
/* bisagra y glúteo */
X("swing","Kettlebell swing","hinge","kb","r",5,10,60,"l2 h1 a1","Es bisagra, no sentadilla: la potencia sale de la cadera y arriba haces plancha de pie. Calidad, no fatiga.");
X("rdl","Peso muerto rumano","hinge","db|kb","r",3,10,60,"l2 h1","Rodillas algo flexionadas y peso pegado a las piernas. Baja en 3 s y solo hasta donde mantienes la columna recta.");
X("trxcurl","Curl femoral en TRX","hinge","trx","r",3,8,60,"l1 h1","Cadera alta todo el rato. Protege los isquios del corredor. Si cuesta, puente isométrico con los pies en el TRX.");
X("hipthrust","Hip thrust (puente de glúteo)","glute","","r",3,12,45,"l1","Espalda en banco romano o sofá. Barbilla metida y costillas abajo; empuja con el talón y pausa 2 s arriba sin hiperextender.");
X("hipthrust1","Hip thrust a una pierna","glute","","r",3,8,50,"l1","Pelvis nivelada, sin rotar.",{uni:1});
/* una pierna */
X("splitsq","Split squat","single","","r",3,8,60,"k1 h1 a1","Tronco erguido y rodilla delantera siguiendo la línea del pie. Con mancuernas o kettlebell si quieres carga.",{uni:1});
X("bulg","Sentadilla búlgara","single","roman|step|bench","r",3,7,75,"k2 l1 h2 a1","Pie trasero en el banco romano o en un escalón. Pie delantero bien adelantado y tronco algo inclinado con la columna neutra.",{uni:1});
X("stepup","Step-up","single","step","r",3,8,60,"k1 h1 a1","Empuja con la pierna de arriba; no te impulses con la de abajo.",{uni:1});
X("revlunge","Zancada reversa","single","","r",3,8,60,"k1 l1 h1 a1","Más amable con la rodilla que la frontal. Tronco estable.",{uni:1});
X("sldl","RDL a una pierna","single","kb|db","r",3,6,60,"l1 h1","Cadera cuadrada, sin abrirla, y espalda neutra. Ligero: control antes que peso.",{uni:1});
X("calf","Elevación de gemelos a una pierna","calf","","r",3,12,40,"a2","Rango completo, pausa arriba y bajada lenta. En el borde de un escalón si puedes.",{uni:1});
/* explosividad (fase 2) */
X("sqjump","Salto vertical","power","","r",3,5,60,"l1 k2 a2","Aterrizaje suave y silencioso, con las rodillas alineadas.");
X("broad","Salto horizontal (broad jump)","power","outdoor","r",3,4,75,"l1 k2 a2","Aterriza estable y pegado al suelo. Potencia de salida en natación.");
X("boxjump","Salto al cajón","power","box","r",3,5,75,"l1 k2 a2","Sube saltando y baja andando para ahorrar impacto.");
X("sprint","Sprint corto en cuesta","power","outdoor","t",6,12,75,"l1 k1 h2 a2","Al 90 %, tras un calentamiento completo y nunca con fatiga previa. Vuelve andando.");
X("kbpower","Swing potente","power","kb","r",3,6,60,"l2 h1 a1","Series cortas con máxima intención.");
/* extras que no están en library.md (por el material que tienes) */
X("swimband","Gesto de nadador con goma abierta","prehab","open","r",3,12,40,"s1","Reproduce la entrada y el agarre de la brazada con control. Codo alto y sin encoger el hombro.",{x:1});
X("exrot","Rotación externa con goma","prehab","open|band","r",3,12,40,"","Codo pegado al costado y gira solo el antebrazo hacia fuera, lento.",{uni:1,x:1});
X("minibridge","Puente de glúteo con goma corta","glute","mini","r",3,12,45,"l1","Goma sobre las rodillas: empuja las rodillas hacia fuera mientras subes. Pausa de 2 s arriba.",{x:1});

/* plantillas por enfoque (parejas consecutivas): A tirón y core, B cadena posterior y pierna, F completa */
const PLAN={
  A:[["pullv",["pullv","pullh"]],["core",["core"]],["pullh",["pullh","prehab"]],["core",["core"]],["pullh",["pullh","prehab"]],["core",["core"]],["prehab",["prehab","pullh"]]],
  B:[["hinge",["hinge","glute"]],["core",["core"]],["single",["single"]],["single",["single"]],["glute",["glute","hinge"]],["calf",["calf","single"]],["hinge",["hinge","glute"]],["core",["core"]]],
  F:[["hinge",["hinge","glute"]],["pullh",["pullh","pullv"]],["single",["single"]],["glute",["glute"]],["core",["core"]],["core",["core"]],["prehab",["prehab"]],["calf",["calf"]]]
};
const FOCUS_NAME={A:"Fuerza A: tirón y core",B:"Fuerza B: cadena posterior y pierna",F:"Sesión completa"};
function resolveFocus(site,focus){
  if(focus&&focus!=="auto")return focus;
  if(site==="home"){const l=LS.get("st_last",null);return l==="A"?"B":"A";}
  return "F";
}

function haveSet(tags){const h=new Set(tags);if(h.has("bench")||h.has("box"))h.add("step");return h;}
function avail(e,h){return e.eq.some(a=>a.every(t=>h.has(t)));}
function painOk(e,pain){
  for(const [k,,c] of AREAS){
    const L=pain[k]||0;if(!L)continue;
    const v=e.st[c]||0;
    if(L===1&&v>=2)return false;
    if(L>=2&&v>=1)return false;
  }
  return true;
}
function pick(arr,recent){
  const w=arr.map(e=>(e.w||1)*(e.eq.some(a=>a.length)?2:1)*(recent.has(e.id)?0.3:1));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}
  return arr[arr.length-1];
}
function stepWork(ph,ex,set,side){
  const o={ph,id:ex.id,name:ex.name,cue:ex.cue,set,side};
  if(ex.mode==="t")o.secs=ex.val;else{o.reps=ex.val;o.unit=ex.alt?"reps por lado":"reps";}
  return o;
}
function pushEx(St,ph,ex,set){
  if(ex.uni){
    St.push(stepWork(ph,ex,set,"izquierda"));
    St.push({ph:"switch",name:"Cambia de lado",secs:5,cue:"Ahora, lado derecho."});
    St.push(stepWork(ph,ex,set,"derecha"));
  }else St.push(stepWork(ph,ex,set));
}
function buildSteps(s){
  const St=[];
  St.push({ph:"prep",name:"Prepárate",secs:5,cue:""});
  s.warm.forEach(w=>pushEx(St,"warm",w));
  s.blocks.forEach((b,bi)=>{
    for(let k=1;k<=b.sets;k++){
      b.items.forEach(ex=>pushEx(St,"main",ex,k+"/"+b.sets));
      if(!(bi===s.blocks.length-1&&k===b.sets))St.push({ph:"rest",name:"Descanso",secs:b.rest,cue:""});
    }
  });
  s.cool.forEach(c=>pushEx(St,"cool",c));
  return St;
}
function dur(x){
  if(x.secs)return x.secs;
  const r=x.unit==="reps por lado"?x.reps*2:x.reps;
  return r*3.2+6;
}
function total(St){return St.reduce((a,x)=>a+dur(x),0);}
function makeBlocks(s,picked,soft){
  const m=s.o.mins;
  s.blocks=[];
  if(s.power){const ex=s.power;s.blocks.push({items:[ex],sets:Math.min(ex.sets,m<=30?4:ex.sets),rest:ex.rest,max:ex.sets,power:true});}
  for(let i=0;i<picked.length;i+=2){
    const items=picked.slice(i,i+2);
    const dose=Math.max(...items.map(e=>e.sets));
    const sets=(soft||m<=20)?Math.min(2,dose):dose;
    const rest=Math.max(30,Math.max(...items.map(e=>e.rest))-(items.length>1?15:0));
    s.blocks.push({items,sets,rest,max:dose});
  }
}
function refresh(s){s.steps=buildSteps(s);s.est=total(s.steps);}
function pickWarm(have,pain,focus,nW,power){
  const ok=WARM.filter(e=>avail(e,have)&&painOk(e,pain));
  const gen=ok.filter(e=>e.f==="*"),spec=ok.filter(e=>e.f!=="*"&&e.f.includes(focus));
  const first=gen.filter(e=>e.id==="catcow"),rope=gen.filter(e=>e.id==="rope");
  return [...first,...(power?rope:[]),...spec,...rope.filter(()=>!power)].slice(0,nW);
}
function generate(o){
  const pain=o.eff||o.pain,have=haveSet(o.tags),recent=new Set(LS.get("st_hist",[]));
  const m=o.mins,budget=m*60,focus=o.focus;
  const soft=pain.lumbar>=2;
  const nW=m<=15?2:m<=20?3:m<=30?4:5,nC=m<=15?1:m<=30?2:3;
  const s={o,warm:[],cool:[],blocks:[],est:0,soft,power:null,noPower:""};
  if(o.power){
    if(m<20)s.noPower="con menos de 20 min";
    else if(o.fatigue)s.noPower="por la carga reciente";
    else if(["lumbar","rodilla","cadera","aquiles"].some(k=>(pain[k]||0)>0))s.noPower="por las molestias";
    else{
      const pl=LIB.filter(e=>e.pil==="power"&&avail(e,have)&&painOk(e,pain));
      if(pl.length)s.power=pick(pl,recent);else s.noPower="sin material o por las molestias";
    }
  }
  s.warm=pickWarm(have,pain,focus,nW,!!s.power);
  s.cool=COOL.filter(e=>avail(e,have)&&painOk(e,pain)&&(e.f==="*"||e.f.includes(focus))).slice(0,nC);
  const picked=[],used=new Set();
  if(s.power)used.add(s.power.id);
  for(const [,pils] of PLAN[focus]){
    let ex=null;
    for(const p of pils){
      const pl=LIB.filter(e=>e.pil===p&&!used.has(e.id)&&avail(e,have)&&painOk(e,pain));
      if(pl.length){ex=pick(pl,recent);break;}
    }
    if(!ex)continue;
    picked.push(ex);used.add(ex.id);
    makeBlocks(s,picked,soft);refresh(s);
    if(s.est>budget&&picked.length>2){picked.pop();used.delete(ex.id);}
  }
  makeBlocks(s,picked,soft);refresh(s);
  if(!soft){
    let ch=true,g=0;
    while(ch&&g++<6){
      ch=false;
      for(const b of s.blocks){
        if(b.power||b.sets>=b.max)continue;
        b.sets++;refresh(s);
        if(s.est<=budget)ch=true;else{b.sets--;refresh(s);}
      }
    }
  }
  return s;
}
function swapEx(s,bi,ii){
  const cur=s.blocks[bi].items[ii],have=haveSet(s.o.tags),pain=s.o.eff||s.o.pain;
  const used=new Set(s.blocks.flatMap(b=>b.items.map(e=>e.id)));
  const pils=cur.pil==="pullv"||cur.pil==="pullh"?["pullv","pullh"]:cur.pil==="hinge"||cur.pil==="glute"?["hinge","glute"]:[cur.pil];
  const pl=LIB.filter(e=>pils.includes(e.pil)&&!used.has(e.id)&&avail(e,have)&&painOk(e,pain)&&(cur.pil==="power"?e.pil==="power":e.pil!=="power"));
  if(!pl.length)return false;
  s.blocks[bi].items[ii]=pick(pl,new Set());
  refresh(s);return true;
}
function specText(ex,sets){
  return sets+" × "+ex.val+(ex.mode==="t"?" s":"")+(ex.uni||ex.alt?" por lado":"");
}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
async function loadRecent(){
  const tok=localStorage.getItem("rh_token"),repo=localStorage.getItem("rh_repo");
  if(!tok||!repo)return;
  try{
    const r=await fetch("https://api.github.com/repos/"+repo+"/contents/health/data.json",{headers:{Authorization:"Bearer "+tok,"X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});
    if(!r.ok)return;
    const j=await r.json();
    const d=JSON.parse(new TextDecoder("utf-8").decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")),c=>c.charCodeAt(0))));
    const now=new Date(),y=new Date(now.getTime()-864e5),T=ymd(now),Y=ymd(y);
    const parts=[];let fat=false;
    [[Y,"Ayer"],[T,"Hoy"]].forEach(([dt,lab])=>{
      const e=(d.entries||[]).find(x=>x.date===dt);
      const acts=((e&&e.activities)||[]).filter(a=>TN[a.type]);
      if(!acts.length)return;
      parts.push(lab+": "+acts.map(a=>TN[a.type]+" "+a.duration_min+" min").join(", ")+".");
      acts.forEach(a=>{if((a.type==="run"&&a.duration_min>=40)||(a.type==="swim"&&a.duration_min>=60)||(a.type==="ride"&&a.duration_min>=60))fat=true;});
    });
    S.recent={text:parts.join(" "),fatigue:fat};
    const el=$("#recent");if(el&&S.view==="setup")el.innerHTML=recentHtml();
  }catch(e){}
}

function fmt(t){return t>=60?Math.floor(t/60)+":"+String(t%60).padStart(2,"0"):String(t);}
function secLeft(){return Math.max(0,Math.ceil((R.paused?R.remMs:R.endAt-Date.now())/1000));}
function beep(f,d){
  if(mute||!AC)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function vib(p){try{if(navigator.vibrate&&!mute)navigator.vibrate(p);}catch(e){}}
async function lock(){try{if("wakeLock" in navigator)wl=await navigator.wakeLock.request("screen");}catch(e){}}
function unlock(){try{if(wl)wl.release();}catch(e){}wl=null;}
function nextUp(){for(let j=R.i+1;j<R.steps.length;j++){const x=R.steps[j];if(x.ph!=="rest"&&x.ph!=="switch")return x;}return null;}
function stepTitle(x){return x.name+(x.side?" ("+x.side+")":"");}
function setBar(){const b=$("#pb");if(b)b.style.width=(R.i/R.steps.length*100)+"%";}
function pauseLabel(){return R.paused?"Seguir":"Pausa";}
function renderRun(){
  const s=R.steps[R.i],nx=nextUp(),timed=!!s.secs;
  const PH={prep:"Prepárate",warm:"Calentamiento",main:"Fuerza",rest:"Descanso",switch:"Cambio de lado",cool:"Vuelta a la calma"};
  const gap=s.ph==="rest"||s.ph==="switch";
  let title=s.name,cue=s.cue,sub="";
  if(s.ph==="prep"){const f=R.steps[1];title="Prepárate";cue="";sub=f?"Empiezas con "+stepTitle(f):"";}
  else if(gap){title=nx?"Siguiente: "+stepTitle(nx):"Casi terminas";cue=nx?nx.cue:"";sub=nx&&nx.set?"Serie "+nx.set:"";}
  else{title=stepTitle(s);sub=s.set?"Serie "+s.set:"";}
  let mainBtn;
  if(!timed)mainBtn='<button class="cb pri" data-a="next">Hecho</button>';
  else if(s.ph==="rest")mainBtn='<button class="cb pri" data-a="add">+15 s</button>';
  else mainBtn='<button class="cb pri" id="pbtn" data-a="pause">'+pauseLabel()+'</button>';
  $("#app").innerHTML=
    '<div class="run"><div class="ph '+s.ph+'">'+PH[s.ph]+'</div><div class="pbar"><i id="pb"></i></div>'+
    '<div class="mid"><div class="rn">'+esc(title)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':"")+
    '<div class="big" id="num">'+(timed?fmt(secLeft()):s.reps)+'</div>'+(timed?"":'<div class="sub">'+esc(s.unit)+"</div>")+
    (cue?'<div class="cue">'+esc(cue)+"</div>":"")+'</div>'+
    (!gap&&nx&&s.ph!=="prep"?'<div class="up">Después: '+esc(stepTitle(nx))+"</div>":"")+
    '<div class="ctl"><button class="cb" data-a="prev">Atrás</button>'+mainBtn+'<button class="cb" data-a="next">Saltar</button></div>'+
    '<div class="ctl2"><button class="lnk" data-a="mute">Sonido: '+(mute?"no":"sí")+'</button><button class="lnk" data-a="end">Terminar</button></div></div>';
  setBar();
}
function enter(i){
  if(R.paused)R.pausedMs+=Date.now()-R.pauseAt;
  R.i=i;R.lastSec=null;R.paused=false;
  const s=R.steps[i];
  if(s.secs){R.endAt=Date.now()+s.secs*1000;if(s.ph!=="rest")beep(880,.12);}
  vib(30);
  renderRun();
}
function tick(){
  if(!R||S.view!=="run")return;
  const s=R.steps[R.i];
  if(!s.secs||R.paused)return;
  const left=Math.ceil((R.endAt-Date.now())/1000);
  if(left<=0){beep(1175,.25);vib([60,40,60]);next();return;}
  if(left!==R.lastSec){
    R.lastSec=left;
    const n=$("#num");if(n)n.textContent=fmt(left);
    if(left<=3)beep(660,.1);
  }
}
function next(){if(R.i>=R.steps.length-1){finish();return;}enter(R.i+1);}
function prev(){if(R.i>0)enter(R.i-1);}
function togglePause(){
  if(R.paused){R.endAt=Date.now()+R.remMs;R.paused=false;R.pausedMs+=Date.now()-R.pauseAt;}
  else{R.remMs=Math.max(0,R.endAt-Date.now());R.paused=true;R.pauseAt=Date.now();}
  const b=$("#pbtn");if(b)b.textContent=pauseLabel();
}
function startRun(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){}
  const ids=[].concat(...S.sess.blocks.map(b=>b.items.map(e=>e.id)));
  LS.set("st_hist",ids.concat(LS.get("st_hist",[])).slice(0,24));
  if(S.sess.o.focus!=="F")LS.set("st_last",S.sess.o.focus);
  R={steps:S.sess.steps,i:0,paused:false,t0:Date.now(),pausedMs:0,lastSec:null};
  S.view="run";lock();
  clearInterval(iv);iv=setInterval(tick,200);
  enter(0);
}
function finish(){
  clearInterval(iv);unlock();if(R.paused)R.pausedMs+=Date.now()-R.pauseAt;R.end=Date.now();S.view="done";
  beep(784,.15);setTimeout(()=>beep(1047,.3),180);vib([100,60,100,60,200]);
  render();
}
function summary(el){
  const s=S.sess;
  const names=s.blocks.flatMap(b=>b.items.map(e=>e.name+" "+specText(e,b.sets))).join("; ");
  const pain=AREAS.filter(a=>s.o.pain[a[0]]).map(a=>a[1].toLowerCase()+(s.o.pain[a[0]]===2?" (dolor)":" (molestia)"));
  return (s.o.focus==="F"?"Fuerza":FOCUS_NAME[s.o.focus].split(":")[0])+" en "+s.o.siteName+", "+el+" min. "+names+"."+(pain.length?" Zonas con molestia: "+pain.join(", ")+".":"");
}
function renderDone(){
  const el=Math.max(1,Math.round((R.end-R.t0-R.pausedMs)/60000));
  R.txt=summary(el);
  $("#app").innerHTML=
    '<div class="card"><div class="kv num">'+el+'</div><div class="ku">minutos de fuerza</div>'+
    '<p class="note" style="margin-top:0">'+esc(R.txt)+'</p></div>'+
    '<button class="go" data-a="copy">Copiar resumen</button>'+
    '<p class="note" style="text-align:center">Pégalo en el chat con Claude y lo registro como sesión de fuerza.</p>'+
    '<button class="go alt" data-a="again">Nueva sesión</button>';
}
async function copyTxt(){
  const t=R.txt;
  try{await navigator.clipboard.writeText(t);toast("Copiado");}
  catch(e){
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("Copiado");}catch(_){toast("No se pudo copiar");}
    ta.remove();
  }
}

/* --- acciones --- */
function gen(){
  const st=SITES[S.site];
  const fat=!!(S.recent&&S.recent.fatigue&&!S.ign);
  const eff=Object.assign({},S.pain);if(fat)eff.lumbar=Math.max(eff.lumbar,1);
  S.sess=generate({site:S.site,siteName:st.n,tags:st.t,mins:S.mins,pain:Object.assign({},S.pain),eff,fatigue:fat,focus:resolveFocus(S.site,S.focus),power:S.power});
  LS.set("st_mins",S.mins);S.view="preview";render();window.scrollTo(0,0);
}
function act(t,v){
  switch(t){
    case "site":S.site=v;S.edit=false;LS.set("st_site",v);renderSetup();break;
    case "edit":S.edit=!S.edit;if(S.edit){const s=SITES[S.site];S.draft={d:s.d||"",t:s.t.slice()};}renderSetup();break;
    case "tog":{const i=S.draft.t.indexOf(v);if(i<0)S.draft.t.push(v);else S.draft.t.splice(i,1);$("#edchips").innerHTML=eqChipsEd();break;}
    case "save":SITES[S.site]=Object.assign({},SITES[S.site],{d:S.draft.d.trim(),t:S.draft.t.slice()});LS.set("st_sites",SITES);S.edit=false;renderSetup();toast("Equipamiento guardado");break;
    case "mins":S.mins=+v;paintTimes();break;
    case "cm":{const n=parseInt(v,10);if(n>=10&&n<=120){S.mins=n;paintTimes();}break;}
    case "pain":S.pain[v]=(S.pain[v]+1)%3;$("#pain").innerHTML=painHtml();break;
    case "focus":S.focus=v;paintFocus();break;
    case "power":S.power=!S.power;LS.set("st_power",S.power);renderSetup();break;
    case "ign":S.ign=!S.ign;{const el=$("#recent");if(el)el.innerHTML=recentHtml();}break;
    case "gen":gen();break;
    case "back":S.view="setup";render();break;
    case "swap":{const [bi,ii]=v.split(",").map(Number);if(swapEx(S.sess,bi,ii))renderPreview();else toast("No hay otra opción para este ejercicio");break;}
    case "start":startRun();break;
    case "pause":togglePause();break;
    case "add":{if(R.paused)R.remMs+=15000;else R.endAt+=15000;R.lastSec=null;const n=$("#num");if(n)n.textContent=fmt(secLeft());break;}
    case "next":next();break;
    case "prev":prev();break;
    case "mute":mute=!mute;LS.set("st_mute",mute);renderRun();break;
    case "end":if(confirm("¿Terminar la sesión ahora?"))finish();break;
    case "copy":copyTxt();break;
    case "again":S.view="setup";render();break;
  }
}
function render(){
  if(S.view==="setup")renderSetup();
  else if(S.view==="preview")renderPreview();
  else if(S.view==="run")renderRun();
  else renderDone();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(b)act(b.dataset.a,b.dataset.v);
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&R&&S.view==="run")lock();});
initTheme();
render();
loadRecent();
</script>
</body>
