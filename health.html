<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="health">
<title>health · rafa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg:      #141412;
  --s1:      #1E1D1A;
  --s2:      #252320;
  --border:  #2E2C28;
  --text:    #F0EDE8;
  --t2:      #A09C94;
  --t3:      #6B6760;

  /* pastels on dark */
  --blue:    #93c5fd;
  --blue-bg: #0c1a2e;
  --green:   #86efac;
  --green-bg:#052e16;
  --rose:    #fca5a5;
  --rose-bg: #2a1215;
  --amber:   #fcd34d;
  --amber-bg:#1c1500;
  --violet:  #c4b5fd;
  --violet-bg:#1a1030;

  --swim:    #7dd3fc;
  --run:     #86efac;
  --str:     #fdba74;

  --r: 8px; --rs: 5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.5;min-height:100vh;
  -webkit-text-size-adjust:100%;
}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.back{
  font-size:12px;color:var(--t3);text-decoration:none;
  display:flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:var(--rs);
  border:1px solid var(--border);
  transition:color .1s,background .1s;
}
.back:hover{color:var(--text);background:var(--s2)}
.hdr-title{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.hdr-title span{color:var(--t3);font-weight:400}

/* tabs */
.tabs{display:flex;background:var(--s1);border:1px solid var(--border);border-radius:var(--rs);padding:3px;gap:2px}
.tab{
  padding:4px 14px;border:none;border-radius:4px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--t2);background:transparent;
  transition:background .12s,color .12s;font-family:inherit;
}
.tab.on{background:var(--s2);color:var(--text);border:1px solid var(--border)}

/* ── SETUP ── */
#setup{
  max-width:400px;margin:5rem auto;padding:20px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
}
#setup h2{font-size:14px;font-weight:600;margin-bottom:6px}
#setup p{color:var(--t2);font-size:13px;line-height:1.5;margin-bottom:16px}
#setup input{
  width:100%;padding:8px 10px;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--rs);
  color:var(--text);font-size:13px;margin-bottom:10px;outline:none;
  font-family:inherit;
}
#setup input:focus{border-color:var(--blue)}
#setup button{
  width:100%;padding:8px;background:var(--s2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-weight:500;
  cursor:pointer;font-size:13px;font-family:inherit;
  transition:background .1s;
}
#setup button:hover{background:var(--border)}

/* ── WRAP ── */
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 80px}

/* date nav */
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.dnav button{
  background:var(--s1);border:1px solid var(--border);color:var(--t2);
  border-radius:var(--rs);padding:5px 10px;cursor:pointer;font-size:12px;
  font-family:inherit;transition:background .1s,color .1s;
}
.dnav button:hover{background:var(--s2);color:var(--text)}
.dlabel{font-size:13px;font-weight:500;flex:1;text-align:center;color:var(--t2)}
.today-btn{margin-left:auto!important}

/* ── CARDS ── */
.card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
}
.card-label{font-size:11px;color:var(--t3);margin-bottom:8px;font-weight:500}

/* stat blocks */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.stat-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px;
}
.stat-label{font-size:11px;color:var(--t3);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.stat-sub{font-size:11px;color:var(--t3);margin-top:4px}

/* tinted stat cards */
.s-blue{background:var(--blue-bg);border-color:#1e3a7a}
.s-blue .stat-val{color:var(--blue)}
.s-green{background:var(--green-bg);border-color:#166534}
.s-green .stat-val{color:var(--green)}
.s-rose{background:var(--rose-bg);border-color:#7f1d1d}
.s-rose .stat-val{color:var(--rose)}
.s-amber{background:var(--amber-bg);border-color:#713f12}
.s-amber .stat-val{color:var(--amber)}
.s-violet{background:var(--violet-bg);border-color:#4c1d95}
.s-violet .stat-val{color:var(--violet)}

/* bar */
.bar-wrap{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:10px}
.bar{height:100%;border-radius:2px;transition:width .4s}

/* rows */
.row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.row:last-child{border:none}

/* activity row */
.aico{
  width:28px;height:28px;border-radius:var(--rs);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.sw{background:rgba(125,211,252,.12)} .ru{background:rgba(134,239,172,.12)} .st{background:rgba(253,186,116,.12)}
.ainfo{flex:1}
.aname{font-size:13px;font-weight:500}
.ameta{font-size:11px;color:var(--t3)}
.akcal{font-size:12px;font-weight:500;color:var(--rose);white-space:nowrap}

/* food row */
.fmeal{font-size:11px;color:var(--t3);width:62px;flex-shrink:0;text-transform:lowercase}
.fitems{font-size:13px;flex:1}
.fkcal{font-size:12px;font-weight:500;color:var(--violet);white-space:nowrap}

/* week detail */
.wlabel{width:60px;font-size:12px;color:var(--t3);flex-shrink:0}
.wacts{flex:1;font-size:12px;display:flex;flex-wrap:wrap;gap:6px}
.wkcal{font-size:12px;font-weight:500;color:var(--blue);white-space:nowrap}
.row.today{background:var(--s2);border-radius:var(--rs);padding:8px 10px;margin:0 -2px}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhead{font-size:11px;color:var(--t3);text-align:center;padding-bottom:4px}
.mday{
  aspect-ratio:1;border-radius:var(--rs);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12px;font-weight:500;
  cursor:pointer;border:1px solid transparent;transition:.12s;color:var(--t2);
}
.mday:hover{border-color:var(--border);color:var(--text)}
.mday.today{border-color:var(--blue);color:var(--text)}
.mday.has{background:var(--s2);color:var(--text)}
.mday.def{background:var(--green-bg)}
.mday.sur{background:var(--rose-bg)}
.mday.blank{opacity:.2;pointer-events:none}
.dots{display:flex;gap:2px;margin-top:2px}
.dot{width:4px;height:4px;border-radius:50%}

/* chart */
.chart-wrap{position:relative;height:180px}

/* g2 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* empty */
.empty{color:var(--t3);font-size:13px;padding:16px 0;text-align:center}

@media(max-width:500px){
  .stats,.g2{grid-template-columns:1fr 1fr}
  .stats .stat-card:last-child{grid-column:1/-1}
}
</style>
</head>
<body>

<div id="setup" style="display:none">
  <h2>Conectar repositorio</h2>
  <p>GitHub token para leer los datos del repo privado. Se guarda solo en este navegador.</p>
  <input type="password" id="tkInput" placeholder="github_pat_…" autocomplete="off">
  <button onclick="saveToken()">Conectar</button>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <a class="back" href="/">← dashboards</a>
    <div class="hdr-title">health <span>· rafa</span></div>
    <div class="tabs">
      <button class="tab on" onclick="setView('day')">día</button>
      <button class="tab" onclick="setView('week')">semana</button>
      <button class="tab" onclick="setView('month')">mes</button>
    </div>
  </div>

  <div class="wrap">
    <div class="dnav">
      <button onclick="navPrev()">←</button>
      <div class="dlabel" id="dlabel">—</div>
      <button onclick="navNext()">→</button>
      <button class="today-btn" onclick="goToday()">hoy</button>
    </div>
    <div id="content"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script>
const REPO      = 'rfleiro/FamilyOps';
const DATA_PATH = 'health/data.json';

let view   = 'day';
let cursor = today0();
let data   = null;
let token  = null;
let wchart = null;

async function init() {
  token = localStorage.getItem('rh_token');
  if (!token) { show('setup'); return; }
  show('app');
  await load();
  render();
}

function show(id) {
  document.getElementById('setup').style.display = id==='setup'?'block':'none';
  document.getElementById('app').style.display   = id==='app'  ?'block':'none';
}

async function saveToken() {
  const t = document.getElementById('tkInput').value.trim();
  if (!t) return;
  localStorage.setItem('rh_token', t);
  token = t; show('app');
  await load(); render();
}

async function load() {
  try {
    const r = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,
      { headers:{ Authorization:`Bearer ${token}`, 'X-GitHub-Api-Version':'2022-11-28' } }
    );
    const j = await r.json();
    data = JSON.parse(atob(j.content.replace(/\n/g,'')));
  } catch(e) {
    data = { meta:{ tdee_base:2400 }, entries:[] };
  }
}

function today0() { const d=new Date(); d.setHours(0,0,0,0); return d; }
function fmt(d)    { return d.toISOString().split('T')[0]; }
function TDEE()    { return data?.meta?.tdee_base ?? 2400; }
function entry(ds) { return (data?.entries||[]).find(e=>e.date===ds)||null; }

function balance(e) {
  if (!e) return null;
  const kin  = (e.food||[]).reduce((s,f)=>s+(f.kcal||0),0);
  const kact = (e.activities||[]).reduce((s,a)=>s+(a.kcal_out||0),0);
  return { in:kin, act:kact, net:kin-(TDEE()+kact) };
}

function weekDates(ref) {
  const m = new Date(ref);
  m.setDate(m.getDate()-((m.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(m); d.setDate(d.getDate()+i); return d; });
}

function monthDates(ref) {
  const [y,mo]=[ref.getFullYear(),ref.getMonth()];
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  const out=Array((first.getDay()+6)%7).fill(null);
  for(let i=1;i<=last.getDate();i++) out.push(new Date(y,mo,i));
  return out;
}

function navPrev() {
  if(view==='day') cursor.setDate(cursor.getDate()-1);
  else if(view==='week') cursor.setDate(cursor.getDate()-7);
  else cursor.setMonth(cursor.getMonth()-1);
  render();
}
function navNext() {
  if(view==='day') cursor.setDate(cursor.getDate()+1);
  else if(view==='week') cursor.setDate(cursor.getDate()+7);
  else cursor.setMonth(cursor.getMonth()+1);
  render();
}
function goToday() { cursor=today0(); render(); }
function goDay(y,m,d){ cursor=new Date(y,m,d); setView('day'); }
function setView(v) {
  view=v;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['day','week','month'][i]===v));
  render();
}

function render() {
  if (!data) return;
  const lo={timeZone:'Europe/Madrid'};
  const el=document.getElementById('dlabel');
  if(view==='day')
    el.textContent=cursor.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',...lo});
  else if(view==='week'){
    const days=weekDates(cursor);
    el.textContent=`${days[0].getDate()}–${days[6].getDate()} ${days[6].toLocaleDateString('es-ES',{month:'long',...lo})}`;
  } else {
    el.textContent=cursor.toLocaleDateString('es-ES',{month:'long',year:'numeric',...lo});
  }
  if(view==='day') renderDay();
  else if(view==='week') renderWeek();
  else renderMonth();
}

/* ── DAY ── */
function renderDay() {
  const e=entry(fmt(cursor)), bal=balance(e);
  const kin=bal?.in??0, kact=bal?.act??0, net=bal?.net??null;
  const tdee=TDEE();

  document.getElementById('content').innerHTML=`
    <div class="stats">
      <div class="stat-card s-violet">
        <div class="stat-label">ingeridas</div>
        <div class="stat-val">${kin||'—'}</div>
        <div class="stat-sub">kcal</div>
        ${kin?`<div class="bar-wrap"><div class="bar" style="width:${Math.min(100,kin/tdee*100).toFixed(0)}%;background:var(--violet)"></div></div>`:''}
      </div>
      <div class="stat-card s-green">
        <div class="stat-label">quemadas</div>
        <div class="stat-val">${kact||'—'}</div>
        <div class="stat-sub">kcal actividad</div>
        ${kact?`<div class="bar-wrap"><div class="bar" style="width:${Math.min(100,kact/800*100).toFixed(0)}%;background:var(--green)"></div></div>`:''}
      </div>
      <div class="stat-card ${net===null?'':net<=0?'s-green':'s-rose'}">
        <div class="stat-label">balance</div>
        <div class="stat-val">${net===null?'—':(net>0?'+':'')+net}</div>
        <div class="stat-sub">${net===null?'sin datos':net<=0?'déficit ✓':'exceso'}</div>
      </div>
    </div>
    ${e?.weight_kg?`
    <div class="card" style="margin-bottom:8px;display:flex;align-items:baseline;gap:6px">
      <span style="font-size:22px;font-weight:600;color:var(--amber)">${e.weight_kg}</span>
      <span style="font-size:12px;color:var(--t3)">kg</span>
      ${data.meta.weight_goal_kg?`<span style="font-size:11px;color:var(--t3);margin-left:4px">→ objetivo ${data.meta.weight_goal_kg} kg (${(e.weight_kg-data.meta.weight_goal_kg).toFixed(1)} kg)</span>`:''}
    </div>`:''}
    <div class="g2">
      <div class="card">
        <div class="card-label">actividades</div>
        ${renderActs(e)}
      </div>
      <div class="card">
        <div class="card-label">comida</div>
        ${renderFood(e)}
      </div>
    </div>
  `;
}

function icon(t){return{swim:'🏊',run:'🏃',strength:'💪'}[t]||'🏅'}
function ibg(t){return{swim:'sw',run:'ru',strength:'st'}[t]||'st'}
function dotc(t){return{swim:'var(--swim)',run:'var(--run)',strength:'var(--str)'}[t]||'var(--t3)'}

function renderActs(e) {
  const a=e?.activities||[];
  if(!a.length) return `<div class="empty">sin actividades</div>`;
  return a.map(x=>`
    <div class="row">
      <div class="aico ${ibg(x.type)}">${icon(x.type)}</div>
      <div class="ainfo">
        <div class="aname">${x.label||x.type}</div>
        <div class="ameta">${x.duration_min?x.duration_min+' min':''}${x.distance_m?' · '+(x.distance_m/1000).toFixed(1)+' km':''}</div>
      </div>
      <div class="akcal">−${x.kcal_out||0} kcal</div>
    </div>`).join('');
}

function renderFood(e) {
  const f=e?.food||[];
  if(!f.length) return `<div class="empty">sin comida registrada</div>`;
  return f.map(x=>`
    <div class="row">
      <div class="fmeal">${x.meal}</div>
      <div class="fitems">${x.items}</div>
      <div class="fkcal">${x.kcal} kcal</div>
    </div>`).join('');
}

/* ── WEEK ── */
function renderWeek() {
  const days=weekDates(cursor);
  const s=d=>fmt(d);
  const labels=days.map(d=>d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'}));
  const kin =days.map(d=>(entry(s(d))?.food||[]).reduce((a,f)=>a+(f.kcal||0),0));
  const kout=days.map(d=>TDEE()+(entry(s(d))?.activities||[]).reduce((a,x)=>a+(x.kcal_out||0),0));
  const totalIn=kin.reduce((a,v)=>a+v,0);
  const totalOut=kout.reduce((a,v)=>a+v,0);
  const actDays=days.filter(d=>(entry(s(d))?.activities||[]).length>0).length;
  const td=fmt(today0());

  document.getElementById('content').innerHTML=`
    <div class="stats" style="margin-bottom:8px">
      <div class="stat-card s-violet">
        <div class="stat-label">ingesta total</div>
        <div class="stat-val" style="font-size:20px">${totalIn||'—'}</div>
        <div class="stat-sub">~${totalIn?Math.round(totalIn/7):0}/día</div>
      </div>
      <div class="stat-card s-green">
        <div class="stat-label">gasto total</div>
        <div class="stat-val" style="font-size:20px">${totalOut||'—'}</div>
        <div class="stat-sub">TDEE + actividad</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">días activos</div>
        <div class="stat-val" style="font-size:20px">${actDays}<span style="font-size:14px;color:var(--t3)"> /7</span></div>
        <div class="stat-sub">con actividad</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:8px">
      <div class="card-label">kcal ingeridas vs gasto diario</div>
      <div class="chart-wrap"><canvas id="wc"></canvas></div>
    </div>
    <div class="card">
      <div class="card-label">detalle</div>
      ${days.map((d,i)=>{
        const e=entry(s(d)), acts=e?.activities||[], isT=s(d)===td;
        return `<div class="row${isT?' today':''}">
          <div class="wlabel">${d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})}</div>
          <div class="wacts">${acts.length?acts.map(a=>`<span>${icon(a.type)} ${a.label||a.type}</span>`).join(''):'<span style="color:var(--t3)">—</span>'}</div>
          <div class="wkcal">${kin[i]?kin[i]+' kcal':'—'}</div>
        </div>`;
      }).join('')}
    </div>`;

  if(wchart) wchart.destroy();
  wchart=new Chart(document.getElementById('wc').getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Ingeridas',data:kin, backgroundColor:'rgba(196,181,253,.5)',borderRadius:4},
        {label:'Gasto',    data:kout,backgroundColor:'rgba(134,239,172,.3)',borderRadius:4}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#6B6760',font:{size:11},boxWidth:10}}},
      scales:{
        x:{ticks:{color:'#6B6760',font:{size:11}},grid:{color:'#2E2C28'}},
        y:{ticks:{color:'#6B6760',font:{size:11}},grid:{color:'#2E2C28'}}
      }
    }
  });
}

/* ── MONTH ── */
function renderMonth() {
  const days=monthDates(cursor);
  const [y,mo]=[cursor.getFullYear(),cursor.getMonth()];
  const td=fmt(today0());
  const ents=(data?.entries||[]).filter(e=>{const d=new Date(e.date);return d.getFullYear()===y&&d.getMonth()===mo;});
  const sw=ents.filter(e=>e.activities?.some(a=>a.type==='swim')).length;
  const ru=ents.filter(e=>e.activities?.some(a=>a.type==='run')).length;
  const st=ents.filter(e=>e.activities?.some(a=>a.type==='strength')).length;

  document.getElementById('content').innerHTML=`
    <div class="card" style="margin-bottom:8px">
      <div class="mgrid">
        ${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(l=>`<div class="mhead">${l}</div>`).join('')}
        ${days.map(d=>{
          if(!d) return '<div></div>';
          const ds=fmt(d), e=entry(ds), bal=balance(e);
          const isT=ds===td;
          const acts=[...new Set((e?.activities||[]).map(a=>a.type))];
          let cls='mday';
          if(!d) cls+=' blank';
          if(isT) cls+=' today';
          else if(e && bal && bal.net<=-100) cls+=' def';
          else if(e) cls+=' has';
          return `<div class="${cls}" onclick="goDay(${d.getFullYear()},${d.getMonth()},${d.getDate()})">
            <span>${d.getDate()}</span>
            <div class="dots">${acts.slice(0,3).map(t=>`<div class="dot" style="background:${dotc(t)}"></div>`).join('')}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="stats">
      <div class="stat-card s-blue">
        <div class="stat-label">🏊 natación</div>
        <div class="stat-val">${sw}</div>
        <div class="stat-sub">sesiones</div>
      </div>
      <div class="stat-card s-green">
        <div class="stat-label">🏃 carrera</div>
        <div class="stat-val">${ru}</div>
        <div class="stat-sub">sesiones</div>
      </div>
      <div class="stat-card s-amber">
        <div class="stat-label">💪 fuerza</div>
        <div class="stat-val">${st}</div>
        <div class="stat-sub">sesiones</div>
      </div>
    </div>`;
}
