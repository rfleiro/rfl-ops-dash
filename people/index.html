<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme:dark)">
<meta name="robots" content="noindex,nofollow">
<title>people</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237C3AED'/><text y='70' x='50' text-anchor='middle' font-size='56' font-family='sans-serif' font-weight='600' fill='white'>p</text></svg>">
<link rel="stylesheet" href="../shared/style.css?v=20260917-0040">
<style>
.page{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.ph h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
.ph-sub{font-size:12px;color:var(--text-3);margin-top:2px}

.tl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;margin-bottom:16px}
.tl-svg{display:block;min-width:560px;width:100%}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-2)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.sec-hd{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:20px}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:13px;cursor:pointer;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--border-strong)}
.card.sel{border-color:var(--accent);background:var(--accent-bg)}
.card.alum{opacity:.5}
.card.alum:hover{opacity:.8}
.cn{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.cr{font-size:11px;color:var(--text-2);margin-bottom:7px}
.cpath{font-size:10px;color:var(--text-3);margin-bottom:5px}
.cfocus{font-size:11px;margin-bottom:7px}
.ctags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.ctag{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--text-2)}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
.cdates{font-size:10px;color:var(--text-3)}
.cissue{font-size:10px;color:var(--accent);text-decoration:none;padding:1px 6px;border:1px solid var(--accent-border);border-radius:var(--rs);background:var(--accent-bg)}
.cissue:hover{background:var(--accent);color:#fff}
.cnote{font-size:10px;color:var(--warning);margin-top:4px}
.joining{font-size:10px;color:var(--text-3);font-style:italic;display:block;margin-top:1px}
.cwhere{font-size:10px;color:var(--text-3);margin-top:3px}

.alum-btn{font-size:11px;color:var(--text-2);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 0;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.alum-btn:hover{color:var(--accent)}

.setup{max-width:360px;margin:80px auto;text-align:center}
.setup h1{font-size:20px;font-weight:600;margin-bottom:6px}
.setup p{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.6}
.setup input{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;margin-bottom:10px;outline:none;display:block}
.setup input:focus{border-color:var(--accent)}

.tip{position:fixed;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--rs);padding:5px 9px;font-size:11px;line-height:1.5;pointer-events:none;z-index:200;box-shadow:0 3px 10px rgba(0,0,0,.12);display:none}
.tip b{font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip"></div>
<script>
const PAT_KEY = "dash:people:pat";
const REPO    = "rfleiro/rfl_ops";
const CSVPATH = "data/people.csv";
const GH_ISS  = "https://github.com/rfleiro/rfl_ops/issues/";
const BUILD   = "20260917-0040";

let persons = [], selected = null, showAlumni = false;

/* ── tiers ──────────────────────────────────────────────── */
const TIER = [
  { label:"PI & senior", color:"#2563EB" },
  { label:"Post-docs",   color:"#16A34A" },
  { label:"PhD",         color:"#7C3AED" },
  { label:"TFM",         color:"#D97706" },
  { label:"TFG",         color:"#B45309" },
  { label:"Technicians", color:"#0891B2" },
  { label:"Short stays", color:"#9CA3AF" },
];
function toTier(r) {
  r = (r||"").toLowerCase();
  if(r==="pi"||r.includes("senior inv")||r.includes("lab manager")) return 0;
  if(r==="pd"||r.includes("postdoc"))                               return 1;
  if(r==="phd")                                                      return 2;
  if(r==="tfm")                                                      return 3;
  if(r==="tfg")                                                      return 4;
  if(r.includes("techni"))                                           return 5;
  return 6;
}

/* ── CSV parser ──────────────────────────────────────────── */
function parseCsv(txt) {
  const lines = txt.trim().split("\n");
  const hdrs  = lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
  return lines.slice(1).map(line=>{
    const vals=[]; let cur="", inQ=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){inQ=!inQ;continue;}
      if(line[i]===','&&!inQ){vals.push(cur);cur="";}else cur+=line[i];
    }
    vals.push(cur);
    const row={};
    hdrs.forEach((h,i)=>row[h]=(vals[i]||"").replace(/^"|"$/g,"").trim());
    return row;
  }).filter(r=>r.Name);
}

/* ── group stints → persons ──────────────────────────────── */
function groupPeople(rows) {
  const map={};
  rows.forEach(r=>{
    if(!map[r.Name]) map[r.Name]={name:r.Name,stints:[],issue:""};
    map[r.Name].stints.push(r);
    if(r.Issue) map[r.Name].issue=r.Issue;
  });
  const today=new Date().toISOString().slice(0,10);
  return Object.values(map).map(p=>{
    p.stints.sort((a,b)=>a.Start.localeCompare(b.Start));
    const last=p.stints[p.stints.length-1];
    p.tier     = toTier(last.Role);
    p.role     = last.Role;
    p.isCurrent= last.End==="present"||(last.End>today&&p.stints[0].Start<=today);
    p.isFuture = p.stints[0].Start>today;
    p.startDate= p.stints[0].Start;
    p.endDate  = last.End;
    p.focus    = last.Current_Focus;
    p.proj1    = last.Project_Primary;
    p.proj2    = last.Project_Secondary;
    p.notes    = last.Notes;
    p.whereNext= last.Where_Next;
    const roles=[...new Set(p.stints.map(s=>s.Role))];
    p.path=roles.length>1?roles.join(" → "):null;
    return p;
  });
}

/* ── timeline SVG ────────────────────────────────────────── */
function buildTimeline(ps) {
  const W=900, PL=8, PR=12, PT=22, PB=8;
  const ROW=6, BAR=3, SEPGAP=5;
  const T0=new Date("2017-01-01").getTime();
  const T1=new Date("2028-07-01").getTime();
  const today=new Date(), todayStr=today.toISOString().slice(0,10);

  function tx(d){
    const ms=(d==="present"?today:new Date(d)).getTime();
    return PL+(ms-T0)/(T1-T0)*(W-PL-PR);
  }

  const tiers=TIER.map(()=>[]);
  ps.forEach(p=>tiers[p.tier].push(p));
  tiers.forEach(t=>t.sort((a,b)=>a.startDate.localeCompare(b.startDate)));

  const items=[]; let y=PT, first=true;
  tiers.forEach((tp,ti)=>{
    if(!tp.length) return;
    if(!first) y+=SEPGAP;
    first=false;
    tp.forEach(p=>{ items.push({p,y:y+(ROW-BAR)/2,ti}); y+=ROW; });
  });
  const H=y+PB;

  let s=`<svg class="tl-svg" viewBox="0 0 ${W} ${H}" id="tl-svg">`;

  // year lines
  for(let yr=2017;yr<=2028;yr++){
    const x=tx(`${yr}-01-01`);
    s+=`<line x1="${x.toFixed(1)}" y1="${PT-8}" x2="${x.toFixed(1)}" y2="${H-PB}" stroke="var(--border)" stroke-width=".5"/>`;
    if(yr%2===0||yr===2017)
      s+=`<text x="${x.toFixed(1)}" y="${PT-9}" text-anchor="middle" font-size="7.5" fill="var(--text-3)" font-family="system-ui,sans-serif">${yr}</text>`;
  }

  // today
  const tx0=tx(todayStr);
  s+=`<line x1="${tx0.toFixed(1)}" y1="${PT-8}" x2="${tx0.toFixed(1)}" y2="${H-PB}" stroke="var(--accent)" stroke-width=".8" stroke-dasharray="2,2"/>`;

  // bars
  items.forEach(({p,y,ti})=>{
    const color=TIER[ti].color;
    p.stints.forEach(st=>{
      const x1=tx(st.Start);
      const x2=Math.max(tx(st.End==="present"?todayStr:st.End),x1+3);
      const isFut=st.Start>todayStr;
      const op=selected?(selected===p.name?1:.07):.68;
      const nm=p.name.replace(/"/g,"&quot;");
      if(isFut){
        s+=`<rect class="tl-bar" data-name="${nm}" x="${x1.toFixed(1)}" y="${y.toFixed(1)}" width="${(x2-x1).toFixed(1)}" height="${BAR}" rx="${BAR/2}" fill="none" stroke="${color}" stroke-width="1.2" stroke-dasharray="2.5,2" style="opacity:${op};cursor:pointer;transition:opacity .18s"/>`;
      } else {
        s+=`<rect class="tl-bar" data-name="${nm}" x="${x1.toFixed(1)}" y="${y.toFixed(1)}" width="${(x2-x1).toFixed(1)}" height="${BAR}" rx="${BAR/2}" fill="${color}" style="opacity:${op};cursor:pointer;transition:opacity .18s"/>`;
      }
    });
  });

  s+=`</svg>`;
  return s;
}

/* ── date formatter ──────────────────────────────────────── */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(d){
  if(!d||d==="-"||d==="") return "";
  if(d==="present") return "present";
  const [y,m]=d.split("-");
  return `${MONTHS[+m-1]} ${y}`;
}

/* ── card HTML ───────────────────────────────────────────── */
function cardHTML(p){
  const tags=[p.proj1,p.proj2].filter(t=>t&&t!=="-"&&t!=="");
  return `<div class="card${selected===p.name?" sel":""}${!p.isCurrent&&!p.isFuture?" alum":""}" data-name="${p.name}">
  <div class="cn">${p.name}${p.isFuture?`<span class="joining">joining ${fmt(p.startDate)}</span>`:""}</div>
  <div class="cr">${p.role}</div>
  ${p.path?`<div class="cpath">${p.path}</div>`:""}
  ${p.focus&&p.focus!=="-"?`<div class="cfocus">${p.focus}</div>`:""}
  ${tags.length?`<div class="ctags">${tags.map(t=>`<span class="ctag">${t}</span>`).join("")}</div>`:""}
  ${p.notes&&p.notes!=="-"?`<div class="cnote">&#9888; ${p.notes}</div>`:""}
  ${!p.isCurrent&&!p.isFuture&&p.whereNext&&p.whereNext!=="-"?`<div class="cwhere">&#8594; ${p.whereNext}</div>`:""}
  <div class="cfoot">
    <span class="cdates">${fmt(p.startDate)} – ${p.isCurrent?"present":fmt(p.endDate)}</span>
    ${p.issue?`<a class="cissue" href="${GH_ISS}${p.issue}" target="_blank">#${p.issue}</a>`:""}
  </div>
</div>`;
}

/* ── highlight (no full re-render) ──────────────────────── */
function updateHL(){
  document.querySelectorAll(".tl-bar").forEach(b=>{
    b.style.opacity=selected?(selected===b.dataset.name?1:.07):.68;
  });
  document.querySelectorAll(".card").forEach(c=>{
    c.classList.toggle("sel",c.dataset.name===selected);
  });
}

/* ── full render ─────────────────────────────────────────── */
function render(){
  const curr=persons.filter(p=>p.isCurrent||p.isFuture);
  const alum=persons.filter(p=>!p.isCurrent&&!p.isFuture);

  document.getElementById("app").innerHTML=`
<div class="page">
  <div class="ph">
    <div>
      <h1>people</h1>
      <div class="ph-sub">lab since 2017 · ${curr.length} current · ${alum.length} alumni</div>
    </div>
    <button class="btn btn-icon" id="disc-btn" title="Disconnect">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 5l2 2-2 2M5 7h6M1 7a6 6 0 106 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="tl-wrap">${buildTimeline(persons)}</div>
  <div class="legend">${TIER.map(t=>`<span class="leg"><span class="leg-dot" style="background:${t.color}"></span>${t.label}</span>`).join("")}</div>

  <div class="sec-hd">current &middot; ${curr.length}</div>
  <div class="grid">${curr.map(cardHTML).join("")}</div>

  <button class="alum-btn" id="alum-btn">
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="${showAlumni?"M2 4l3 3 3-3":"M2 3l3 3 3-3"}" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
    alumni &middot; ${alum.length}
  </button>
  ${showAlumni?`<div class="grid">${alum.map(cardHTML).join("")}</div>`:""}

  <div style="font-size:10px;color:var(--text-3);margin-top:32px">build ${BUILD}</div>
</div>`;

  document.getElementById("disc-btn")?.addEventListener("click",()=>{
    localStorage.removeItem(PAT_KEY); showSetup();
  });
  document.getElementById("alum-btn")?.addEventListener("click",()=>{
    showAlumni=!showAlumni; render();
  });
}

/* ── setup ───────────────────────────────────────────────── */
function showSetup(err){
  document.getElementById("app").innerHTML=`
<div class="setup">
  <h1>people</h1>
  <p>Enter a GitHub PAT with <strong>Contents: Read</strong> access to rfl_ops.</p>
  ${err?`<p style="color:var(--danger);font-size:12px;margin-bottom:12px">${err}</p>`:""}
  <input type="password" id="pi" placeholder="github_pat_&hellip;" autocomplete="off">
  <button class="btn btn-p" style="width:100%;justify-content:center" id="conn-btn">Connect</button>
</div>`;
  const go=()=>{
    const pat=document.getElementById("pi")?.value.trim();
    if(!pat) return;
    localStorage.setItem(PAT_KEY,pat);
    loadData(pat);
  };
  document.getElementById("pi")?.addEventListener("keydown",e=>e.key==="Enter"&&go());
  document.getElementById("conn-btn")?.addEventListener("click",go);
}

/* ── load data ───────────────────────────────────────────── */
async function loadData(pat){
  try{
    const r=await fetch(
      `https://api.github.com/repos/${REPO}/contents/${CSVPATH}?ref=HEAD&t=${Date.now()}`,
      {headers:{Authorization:`token ${pat}`,Accept:"application/vnd.github+json"}}
    );
    if(!r.ok) throw new Error(`GitHub ${r.status}`);
    const j=await r.json();
    const txt=atob(j.content.replace(/\n/g,""));
    persons=groupPeople(parseCsv(txt));
    render();
  } catch(e){
    localStorage.removeItem(PAT_KEY);
    showSetup(e.message);
  }
}

/* ── global events (once) ────────────────────────────────── */
document.addEventListener("click",e=>{
  if(e.target.closest(".cissue")) return;
  const bar =e.target.closest(".tl-bar");
  const card=e.target.closest(".card");
  if(bar){
    const name=bar.dataset.name;
    selected=selected===name?null:name;
    updateHL();
    if(selected){
      const c=document.querySelector(`.card[data-name="${name}"]`);
      if(c) setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"nearest"}),40);
    }
  } else if(card){
    const name=card.dataset.name;
    selected=selected===name?null:name;
    updateHL();
  } else if(selected){
    selected=null; updateHL();
  }
});

document.addEventListener("mousemove",e=>{
  const bar=e.target.closest(".tl-bar");
  const tip=document.getElementById("tip");
  if(!tip) return;
  if(bar&&persons.length){
    const p=persons.find(p=>p.name===bar.dataset.name);
    if(p){
      tip.innerHTML=`<b>${p.name}</b> &middot; ${p.role}<br>${fmt(p.startDate)} &ndash; ${p.isCurrent?"present":fmt(p.endDate)}`;
      tip.style.display="block";
      tip.style.left=(e.clientX+14)+"px";
      tip.style.top =(e.clientY-8)+"px";
    }
  } else {
    tip.style.display="none";
  }
});

/* ── init ────────────────────────────────────────────────── */
(async()=>{
  const pat=localStorage.getItem(PAT_KEY);
  if(pat) await loadData(pat); else showSetup();
})();
</script>
</body>
</html>
