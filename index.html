<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dashboards">
<meta name="robots" content="noindex, nofollow">
<title>dashboards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563EB'/><rect x='22' y='22' width='24' height='24' rx='4' fill='white'/><rect x='54' y='22' width='24' height='24' rx='4' fill='white' opacity='.6'/><rect x='22' y='54' width='24' height='24' rx='4' fill='white' opacity='.6'/><rect x='54' y='54' width='24' height='24' rx='4' fill='white' opacity='.3'/></svg>">
<link rel="stylesheet" href="shared/style.css?v=20260924-1100">
<script>(function(){var t=localStorage.getItem('dash:theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);})()</script>
<style>.hub-theme-btn{position:fixed;top:16px;right:16px;z-index:10;}</style>
</head>
<body>
<div class="hub" id="hub"></div>
<button class="hub-theme-btn btn btn-icon" id="theme-btn" onclick="toggleTheme()" title="Theme: auto"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.5v11" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.5A5.5 5.5 0 0112.5 7 5.5 5.5 0 017 12.5z" fill="currentColor" opacity=".3"/></svg></button>

<script>
// ─── Theme toggle ─────────────────────────────────────────────────────────────
var THEME_CYCLE=['auto','light','dark'];
function themeIcon(t){
  if(t==='dark')  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 9.5A5.5 5.5 0 014.5 2a5.5 5.5 0 100 10 5.5 5.5 0 007.5-2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  if(t==='light') return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2M3.2 3.2l1.4 1.4M9.4 9.4l1.4 1.4M10.8 3.2l-1.4 1.4M4.6 9.4l-1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.5v11" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.5A5.5 5.5 0 0112.5 7 5.5 5.5 0 017 12.5z" fill="currentColor" opacity=".3"/></svg>';
}
function applyTheme(t){
  if(t==='auto'){document.documentElement.removeAttribute('data-theme');}
  else{document.documentElement.setAttribute('data-theme',t);}
  localStorage.setItem('dash:theme',t);
  var btn=document.getElementById('theme-btn');
  if(btn){btn.innerHTML=themeIcon(t);btn.title='Theme: '+t;}
}
function toggleTheme(){
  var cur=localStorage.getItem('dash:theme')||'auto';
  var next=THEME_CYCLE[(THEME_CYCLE.indexOf(cur)+1)%THEME_CYCLE.length];
  applyTheme(next);
}

// ─── registry ─────────────────────────────────────────────────────────────────
// To add a dashboard: copy ops/ to <id>/, edit its manifest, add a row here.
const DASHBOARDS = [
  { id:"ops",    name:"ops",    desc:"Lab operations \u00b7 tasks, people, projects", path:"ops/",    icon:"\u25E7", color:"#2563EB", live:true  },
  { id:"people", name:"people", desc:"Lab members, alumni and timeline", path:"people/", icon:"\u25CF", color:"#7C3AED", live:true  },
  { id:"grants",  name:"grants",  desc:"Funding history, active grants and pipeline",  path:"grants/",  icon:"\u25B2", color:"#16A34A", live:true  },
  { id:"strategy", name:"strategy", desc:"Grant portfolio \u00b7 objectives \u00b7 theme convergence", path:"strategy/", icon:"\u25C6", color:"#0D9488", live:true  },
  { id:"health", name:"health", desc:"Actividad \u00b7 comida \u00b7 peso y balance diario", path:"health/", icon:"\u2665", color:"#E11D48", live:true  },
  { id:"issues", name:"issues", desc:"Kanban \u00b7 calendar view of all open issues \u2014 on demand", path:"issues/", icon:"\u25A4", color:"#0F766E", live:true  }];

document.getElementById("hub").innerHTML =
  "<h1>dashboards</h1><div class='sub'>"
  + new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})
  + "</div>"
  + DASHBOARDS.map(function(d){
      const inner =
          "<div class='hub-ic' style=\"background:" + d.color + "1a;color:" + d.color + "\">" + d.icon + "</div>"
        + "<div class='hub-t'><div class='hub-n'>" + d.name + "</div>"
        + "<div class='hub-d'>" + d.desc + "</div></div>"
        + (d.live ? "" : "<span class='hub-badge'>soon</span>");
      return d.live
        ? "<a class='hub-item' href='" + d.path + "'>" + inner + "</a>"
        : "<div class='hub-item soon'>" + inner + "</div>";
    }).join("");

// init theme button label
(function(){var t=localStorage.getItem('dash:theme')||'auto';setTimeout(function(){applyTheme(t);},50);})();
</script>
</body>
</html>
