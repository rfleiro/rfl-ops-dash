<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dashboards">
<meta name="robots" content="noindex, nofollow">
<title>dashboards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563EB'/><rect x='22' y='22' width='24' height='24' rx='4' fill='white'/><rect x='54' y='22' width='24' height='24' rx='4' fill='white' opacity='.6'/><rect x='22' y='54' width='24' height='24' rx='4' fill='white' opacity='.6'/><rect x='54' y='54' width='24' height='24' rx='4' fill='white' opacity='.3'/></svg>">
<link rel="stylesheet" href="shared/style.css?v=20260907-1421">
</head>
<body>
<div class="hub" id="hub"></div>

<script>
// ─── registry ─────────────────────────────────────────────────────────────────
// To add a dashboard: copy ops/ to <id>/, edit its manifest, add a row here.
const DASHBOARDS = [
  { id:"ops",    name:"ops",    desc:"Lab operations \u00b7 tasks, people, projects", path:"ops/",    icon:"\u25E7", color:"#2563EB", live:true  },
  { id:"sports", name:"sports", desc:"Training, races and recovery",              path:"sports/", icon:"\u25D4", color:"#16A34A", live:false },
  { id:"family", name:"family", desc:"Home, travel and plans",                    path:"family/", icon:"\u25CD", color:"#D97706", live:false }
];

document.getElementById("hub").innerHTML =
  "<h1>dashboards</h1><div class='sub'>"
  + new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})
  + "</div>"
  + DASHBOARDS.map(function(d){
      const inner =
          "<div class='hub-ic' style=\"background:" + d.color + "1a;color:" + d.color + "\">" + d.icon + "</div>"
        + "<div class='hub-t'><div class='hub-n'>" + d.name + "</div>"
        + "<div class='hub-d'>" + d.desc + "</div></div>"
        + (d.live ? "" : "<span class='hub-badge'>soon</span>");
      return d.live
        ? "<a class='hub-item' href='" + d.path + "'>" + inner + "</a>"
        : "<div class='hub-item soon'>" + inner + "</div>";
    }).join("");
</script>
</body>
</html>
