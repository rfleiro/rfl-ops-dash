<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">

<title>ops</title>

<style>
  :root {
    --bg:#F7F6F3;--surface:#FFFFFF;--surface2:#F0EEE9;--border:#E2DED6;--border-strong:#C8C3BA;
    --text:#1A1916;--text-2:#6B6760;--text-3:#9B9690;
    --accent:#2563EB;--accent-bg:#EFF4FF;--accent-border:#BFCFFF;
    --danger:#DC2626;--danger-bg:#FEF2F2;--danger-border:#FECACA;
    --warning:#D97706;--warning-bg:#FFFBEB;--warning-border:#FDE68A;
    --green:#16A34A;--green-bg:#F0FDF4;--green-border:#BBF7D0;
    --r:8px;--rs:5px;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#141412;--surface:#1E1D1A;--surface2:#252320;--border:#2E2C28;--border-strong:#3E3B36;
    --text:#F0EDE8;--text-2:#A09C94;--text-3:#6B6760;
    --accent:#4F83F7;--accent-bg:#0F1E3D;--accent-border:#1E3A7A;
    --danger:#F87171;--danger-bg:#2A1515;--danger-border:#7F1D1D;
    --warning:#FCD34D;--warning-bg:#1C1500;--warning-border:#713F12;
    --green:#4ADE80;--green-bg:#052E16;--green-border:#166534;
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(80px + env(safe-area-inset-bottom))}
  svg{display:block;flex-shrink:0}
  a{color:var(--accent)}

  .hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .hdr h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .hdr-date{font-size:12px;color:var(--text-3);margin-top:2px}
  .hdr-r{display:flex;gap:6px;flex-shrink:0}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;font-size:12px;font-weight:500;border-radius:var(--rs);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:background .1s,color .1s;font-family:inherit}
  .btn:hover{background:var(--surface2);color:var(--text)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-p:hover{opacity:.9;color:#fff}
  .btn-p.pulse{animation:pulse 2s infinite}
  .btn-icon{padding:6px 8px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.75}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite}

  .sec{margin-bottom:4px}
  .sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
  .sec-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
  .sec-add{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:var(--rs);font-family:inherit}
  .sec-add:hover{color:var(--accent);background:var(--accent-bg)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;border-left:3px solid transparent}
  .card.overdue{border-left-color:var(--danger)}
  .card.today{border-left-color:var(--warning)}
  .card.done{opacity:.45}
  .card.isnew{border-left-color:var(--accent);background:var(--accent-bg)}
  .card-row{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
  .card-title{font-size:13px;font-weight:500;flex:1;line-height:1.4}
  .card-title.struck{text-decoration:line-through;color:var(--text-3)}
  .acts{display:flex;gap:3px;flex-shrink:0}
  .act{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--border);border-radius:var(--rs);background:none;cursor:pointer;color:var(--text-3);text-decoration:none}
  .act:hover{background:var(--surface2);color:var(--text);border-color:var(--border-strong)}
  .act.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
  .act.on-green{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .act.rm:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
  .card-meta{display:flex;gap:5px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px}
  .chip{font-size:11px;padding:2px 6px;border-radius:var(--rs);background:var(--surface2);color:var(--text-2)}
  .chip.overdue{background:var(--danger-bg);color:var(--danger)}
  .chip.today{background:var(--warning-bg);color:var(--warning)}
  .chip.new{background:var(--accent-bg);color:var(--accent)}
  .chip.logged{background:var(--green-bg);color:var(--green)}
  .cnote{font-size:11px;color:var(--text-3);margin-top:5px;font-style:italic}

  .panel{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .panel textarea,.panel input{width:100%;font-size:12px;border:1px solid var(--border);border-radius:var(--rs);padding:6px 8px;background:var(--bg);color:var(--text);font-family:inherit}
  .panel textarea{resize:vertical;min-height:52px}
  .panel textarea:focus,.panel input:focus{outline:none;border-color:var(--accent)}
  .pfield label{font-size:11px;color:var(--text-3);display:block;margin-bottom:3px}
  .pbtns{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}

  .nform{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--r);padding:12px;margin-bottom:6px}
  .nform .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .nform .field label{font-size:11px;color:var(--text-2);display:block;margin-bottom:3px}
  .nform input,.nform select,.nform textarea{width:100%;font-size:12px;border:1px solid var(--border);border-radius:var(--rs);padding:5px 8px;background:var(--surface);color:var(--text);font-family:inherit}
  .nform textarea{resize:none;min-height:40px}
  .nform input:focus,.nform select:focus,.nform textarea:focus{outline:none;border-color:var(--accent)}
  .err{font-size:11px;color:var(--danger);margin-top:4px}

  .warn{background:var(--warning-bg);border:1px solid var(--warning-border);border-radius:var(--r);padding:8px 11px;font-size:12px;color:var(--warning);display:flex;gap:7px;align-items:center;margin-bottom:8px}
  .summary{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--text-2);line-height:1.6;margin-bottom:16px}
  .cal-list{margin-bottom:4px}
  .cal-row{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
  .cal-row:last-child{border-bottom:none}
  .cal-time{font-size:11px;color:var(--text-3);min-width:38px;flex-shrink:0}
  .cal-ev{flex:1}
  .cal-ad{font-size:10px;background:var(--accent-bg);color:var(--accent);padding:1px 6px;border-radius:10px}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:82vh;display:flex;flex-direction:column;gap:12px}
  .modal h2{font-size:14px;font-weight:600}
  .modal p{font-size:12px;color:var(--text-2)}
  .mbtns{display:flex;gap:6px;justify-content:flex-end}
  .mbody{overflow-y:auto;display:flex;flex-direction:column;gap:6px}

  .srow{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--rs);font-size:12px;background:var(--bg)}
  .srow .st{width:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .srow.ok{border-color:var(--green-border);background:var(--green-bg)}
  .srow.err{border-color:var(--danger-border);background:var(--danger-bg)}
  .srow-t{flex:1}
  .srow-k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
  .srow-e{font-size:11px;color:var(--danger);margin-top:3px;word-break:break-word}

  /* Setup / states */
  .center{max-width:420px;margin:0 auto;padding:48px 16px}
  .center h2{font-size:16px;font-weight:600;margin-bottom:8px}
  .center p{font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.6}
  .center input{width:100%;font-size:13px;border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;background:var(--surface);color:var(--text);font-family:'SF Mono','Fira Code',monospace}
  .center input:focus{outline:none;border-color:var(--accent)}
  .steps{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--text-2);line-height:1.7}
  .steps ol{margin:0;padding-left:18px}
  .steps code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:11px;font-family:'SF Mono',monospace}
  .muted{font-size:11px;color:var(--text-3);text-align:center;margin-top:24px;line-height:1.7}
  .load{display:flex;align-items:center;justify-content:center;gap:9px;padding:64px 16px;color:var(--text-3);font-size:13px}
  .ebox{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--danger);margin-bottom:14px;word-break:break-word;line-height:1.6}
  .foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--text-3)}
  .lnk{background:none;border:none;color:var(--text-3);font-size:11px;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit}
  .lnk:hover{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";

// ── CONFIG ────────────────────────────────────────────────────────────────────
// Target repo and token are supplied by the user at first run and kept in
// localStorage only. Nothing identifying is baked into this file.
const BRIEF_PATH = "brief/today.json";
const API       = "https://api.github.com";
const TK_KEY    = "ops_pat";
const REPO_KEY  = "ops_repo";
const TOPICS    = ["admin","lab","IT","project","paper","grant","talk","review","patents"];
let REPO = localStorage.getItem(REPO_KEY) || "";

// ── ICONS ─────────────────────────────────────────────────────────────────────
const IC = {
  check:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  msg:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  cal:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  ext:`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  x:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  plus:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  warn:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  refresh:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
  up:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  ok:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  bad:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  dot:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`,
  load:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`,
};

const TC = {
  project:{bg:"#E1F5EE",tx:"#0F6E56"},paper:{bg:"#EEEDFE",tx:"#534AB7"},
  grant:{bg:"#FAEEDA",tx:"#854F0B"},talk:{bg:"#FBEAF0",tx:"#993556"},
  review:{bg:"#E6F1FB",tx:"#185FA5"},IT:{bg:"#F1EFE8",tx:"#5F5E5A"},
  admin:{bg:"#FAECE7",tx:"#993C1D"},lab:{bg:"#EAF3DE",tx:"#3B6D11"},
  patents:{bg:"#F4C0D1",tx:"#72243E"},"people:lab":{bg:"#E1F5EE",tx:"#0F6E56"},
  "people:alumni":{bg:"#F1EFE8",tx:"#5F5E5A"},"people:networking":{bg:"#EEEDFE",tx:"#534AB7"}
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let TOKEN   = localStorage.getItem(TK_KEY) || "";
let view    = "boot";        // setup | loading | ready | error
const STK   = "ops_state_";
let errMsg  = "";
let BRIEF   = null;
let S       = {ch:{},nt:[]};
let panels  = {};
let showNF  = false;
let syncing = false;
let results = null;
let lastLoad= null;
const TODAY = new Date().toISOString().slice(0,10);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stateKey(){ return STK + (BRIEF ? BRIEF.date : "none"); }
function loadState(){ try{ S = JSON.parse(localStorage.getItem(stateKey())) || {ch:{},nt:[]}; }catch(e){ S={ch:{},nt:[]}; } }
function save(){ try{ localStorage.setItem(stateKey(), JSON.stringify(S)); }catch(e){} }
function ch(n){ return S.ch[n] || {}; }
function setCh(n,p){ S.ch[n] = Object.assign({}, ch(n), p); save(); render(); }

// ── GITHUB API ────────────────────────────────────────────────────────────────
async function api(path, method, body){
  const h = {
    "Authorization":"Bearer " + TOKEN,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };
  if(body) h["Content-Type"] = "application/json";
  let r;
  try{
    r = await fetch(API + path, {method:method||"GET", headers:h, body: body?JSON.stringify(body):undefined, cache:"no-store"});
  }catch(e){
    throw new Error("Sin conexión con GitHub. Comprueba la red.");
  }
  if(!r.ok){
    let msg = r.status + "";
    try{ const j = await r.json(); if(j && j.message) msg += " · " + j.message; }catch(e){}
    if(r.status===401) msg = "401 · Token inválido o revocado.";
    if(r.status===404) msg = "404 · No encontrado. Comprueba el repo configurado y que el token tenga acceso.";
    if(r.status===403) msg += " · Permisos insuficientes o rate limit.";
    throw new Error(msg);
  }
  return r.status===204 ? null : r.json();
}

function b64utf8(b64){
  const bin = atob(String(b64).replace(/\s/g,""));
  const b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(b);
}

async function loadBrief(){
  if(!TOKEN || !REPO){ view="setup"; render(); return; }
  view="loading"; render();
  try{
    const f = await api("/repos/"+REPO+"/contents/"+BRIEF_PATH+"?ref=HEAD&t="+Date.now());
    BRIEF = JSON.parse(b64utf8(f.content));
    if(!BRIEF.items) BRIEF.items = [];
    if(!BRIEF.calendar) BRIEF.calendar = [];
    if(!BRIEF.meta) BRIEF.meta = {summary:"",warnings:[]};
    if(!BRIEF.meta.warnings) BRIEF.meta.warnings = [];
    loadState();
    lastLoad = new Date();
    view="ready";
  }catch(e){
    errMsg = e.message || String(e);
    view="error";
  }
  render();
}

// ── ACTIONS QUEUE ─────────────────────────────────────────────────────────────
function actions(){
  const a = [];
  if(!BRIEF) return a;
  Object.keys(S.ch).forEach(function(n){
    const c = S.ch[n];
    const it = BRIEF.items.find(i=>String(i.number)===String(n));
    const t = it ? it.title : "#"+n;
    if(c.done)    a.push({kind:"done",      number:+n, title:t, field:"done"});
    if(c.log)     a.push({kind:"log",       number:+n, title:t, text:c.log, field:"log"});
    if(c.newDate) a.push({kind:"reschedule",number:+n, title:t, newDate:c.newDate, itemType:it?it.type:"task", field:"newDate"});
  });
  S.nt.forEach(function(t,i){ a.push({kind:"create", idx:i, title:t.title, topic:t.topic, due:t.due, note:t.note}); });
  return a;
}

async function exec(a){
  const base = "/repos/"+REPO+"/issues";
  if(a.kind==="done"){
    await api(base+"/"+a.number, "PATCH", {state:"closed"});
  } else if(a.kind==="log"){
    await api(base+"/"+a.number+"/comments", "POST", {body:"**"+BRIEF.date+"** — "+a.text});
  } else if(a.kind==="reschedule"){
    const iss = await api(base+"/"+a.number);
    const label = a.itemType==="person" ? "Next follow-up" : "Due";
    let body = iss.body || "";
    const re = /📅\s*(Due|Next follow-up)\s*:\s*\d{4}-\d{2}-\d{2}/;
    const line = "📅 " + label + ": " + a.newDate;
    body = re.test(body) ? body.replace(re, line) : (line + "\n\n" + body);
    await api(base+"/"+a.number, "PATCH", {body:body});
  } else if(a.kind==="create"){
    const b = "📅 Due: " + (a.due || "") + "\n\n## Notes\n" + (a.note || "");
    await api(base, "POST", {title:a.title, labels:["task", a.topic], body:b});
  }
}

async function runSync(){
  const acts = actions();
  if(!acts.length || syncing) return;
  syncing = true;
  results = acts.map(a=>Object.assign({}, a, {status:"pending"}));
  openModal(); renderModal();
  for(let i=0;i<results.length;i++){
    results[i].status = "running"; renderModal();
    try{ await exec(results[i]); results[i].status="ok"; }
    catch(e){ results[i].status="err"; results[i].error = e.message || String(e); }
    renderModal();
  }
  // clear successful ones from local state
  const okCreates = [];
  results.forEach(function(r){
    if(r.status!=="ok") return;
    if(r.kind==="create"){ okCreates.push(r.idx); }
    else if(S.ch[r.number]){ delete S.ch[r.number][r.field]; if(!Object.keys(S.ch[r.number]).length) delete S.ch[r.number]; }
  });
  S.nt = S.nt.filter((_,i)=>okCreates.indexOf(i)===-1);
  save();
  syncing = false;
  renderModal(); render();
}

// ── NEW TASK ──────────────────────────────────────────────────────────────────
function addTask(){
  const el = document.getElementById("nt-t");
  const title = el ? el.value.trim() : "";
  if(!title){ document.getElementById("nt-err").textContent = "Título obligatorio."; return; }
  S.nt.push({
    title: title,
    topic: document.getElementById("nt-tp").value,
    due:   document.getElementById("nt-d").value || null,
    note:  document.getElementById("nt-n").value.trim() || null
  });
  showNF = false; save(); render();
}
function rmTask(i){ S.nt.splice(i,1); save(); render(); }

// ── PANELS ────────────────────────────────────────────────────────────────────
function toggleP(n,w){
  const cur = panels[n]||{};
  panels[n] = {log:false,date:false}; panels[n][w] = !cur[w];
  render();
}
function saveLog(n){
  const v = document.getElementById("lt-"+n).value.trim();
  if(v) setCh(n,{log:v}); else { panels[n]={}; render(); }
}
function saveDate(n){
  const v = document.getElementById("dt-"+n).value;
  if(v) setCh(n,{newDate:v}); else { panels[n]={}; render(); }
}

// ── TOKEN ─────────────────────────────────────────────────────────────────────
function saveConfig(){
  const rp = document.getElementById("rp").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/+$/,"");
  const tk = document.getElementById("tk").value.trim();
  const e  = document.getElementById("tk-err");
  if(!/^[\w.-]+\/[\w.-]+$/.test(rp)){ e.textContent = "Formato del repo: owner/nombre"; return; }
  if(!tk){ e.textContent = "Pega el token."; return; }
  REPO = rp; TOKEN = tk;
  try{ localStorage.setItem(REPO_KEY, rp); localStorage.setItem(TK_KEY, tk); }catch(err){}
  loadBrief();
}
function changeToken(){
  if(!confirm("¿Borrar el repo y el token guardados en este dispositivo?")) return;
  TOKEN = ""; REPO = "";
  try{ localStorage.removeItem(TK_KEY); localStorage.removeItem(REPO_KEY); }catch(e){}
  view="setup"; render();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(){ document.getElementById("overlay").classList.add("open"); }
function closeModal(){
  if(syncing) return;
  document.getElementById("overlay").classList.remove("open");
  results = null;
  if(BRIEF) render();
}
function renderModal(){
  const m = document.getElementById("modal");
  if(!results){ m.innerHTML=""; return; }
  const done = results.filter(r=>r.status==="ok").length;
  const bad  = results.filter(r=>r.status==="err").length;
  const KL = {done:"cerrar issue",log:"comentario",reschedule:"nueva fecha",create:"crear task"};
  let h = "<h2>"+(syncing ? "Sincronizando…" : "Sync completado")+"</h2>";
  h += "<p>"+done+" de "+results.length+" correctos"+(bad?" · <span style='color:var(--danger)'>"+bad+" con error</span>":"")+"</p>";
  h += "<div class='mbody'>";
  results.forEach(function(r){
    const cls = r.status==="ok" ? "ok" : r.status==="err" ? "err" : "";
    const ico = r.status==="ok" ? IC.ok : r.status==="err" ? IC.bad : r.status==="running" ? "<span class='spin'>"+IC.load+"</span>" : IC.dot;
    h += "<div class='srow "+cls+"'><span class='st'>"+ico+"</span><div class='srow-t'>"
       + "<div class='srow-k'>"+(KL[r.kind]||r.kind)+(r.number?" · #"+r.number:"")+"</div>"
       + esc(r.title)
       + (r.error?"<div class='srow-e'>"+esc(r.error)+"</div>":"")
       + "</div></div>";
  });
  h += "</div><div class='mbtns'>";
  if(bad && !syncing) h += "<button class='btn' onclick='retryFailed()'>Reintentar fallos</button>";
  h += "<button class='btn "+(syncing?"":"btn-p")+"' onclick='closeModal()' "+(syncing?"disabled":"")+">"+(syncing?"Espera…":"Cerrar")+"</button>";
  h += "</div>";
  m.innerHTML = h;
}
async function retryFailed(){
  const failed = results.filter(r=>r.status==="err");
  if(!failed.length) return;
  syncing = true;
  failed.forEach(r=>{ r.status="pending"; delete r.error; });
  renderModal();
  for(let i=0;i<failed.length;i++){
    failed[i].status="running"; renderModal();
    try{ await exec(failed[i]); failed[i].status="ok"; }
    catch(e){ failed[i].status="err"; failed[i].error = e.message||String(e); }
    renderModal();
  }
  const okCreates=[];
  results.forEach(function(r){
    if(r.status!=="ok") return;
    if(r.kind==="create") okCreates.push(r.idx);
    else if(S.ch[r.number]){ delete S.ch[r.number][r.field]; if(!Object.keys(S.ch[r.number]).length) delete S.ch[r.number]; }
  });
  S.nt = S.nt.filter((_,i)=>okCreates.indexOf(i)===-1);
  save(); syncing=false; renderModal(); render();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function dc(d){ if(!d) return ""; if(d<TODAY) return "overdue"; if(d===TODAY) return "today"; return ""; }
function fd(d){ if(!d) return ""; const p = d.split("-"); return p[2]+"/"+p[1]; }
function ttag(tp){ const c = TC[tp]||{bg:"#eee",tx:"#555"}; return "<span class='tag' style='background:"+c.bg+";color:"+c.tx+"'>"+esc(tp)+"</span>"; }
function hhmm(d){ return d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById("app");

  if(view==="setup"){
    app.innerHTML = "<div class='center'>"
      + "<h2>ops</h2>"
      + "<p>Indica el repositorio de datos y un token con acceso a él. Ambos se guardan sólo en este dispositivo.</p>"
      + "<div class='steps'><ol>"
      + "<li>Crea un token en <a href='https://github.com/settings/personal-access-tokens/new' target='_blank' rel='noopener'>Settings → Developer settings → Fine-grained tokens</a></li>"
      + "<li><b>Repository access</b> → Only select repositories → el repo de datos</li>"
      + "<li><b>Permissions</b> → Contents: <code>Read</code> · Issues: <code>Read and write</code></li>"
      + "</ol></div>"
      + "<div class='pfield' style='margin-bottom:8px'><label style='font-size:11px;color:var(--text-3);display:block;margin-bottom:3px'>Repositorio de datos</label>"
      + "<input id='rp' type='text' placeholder='owner/repo' autocomplete='off' spellcheck='false'></div>"
      + "<div class='pfield'><label style='font-size:11px;color:var(--text-3);display:block;margin-bottom:3px'>Token</label>"
      + "<input id='tk' type='password' placeholder='github_pat_…' autocomplete='off' spellcheck='false'></div>"
      + "<p class='err' id='tk-err'></p>"
      + "<div class='pbtns' style='margin-top:10px'><button class='btn btn-p' onclick='saveConfig()'>Guardar y entrar</button></div>"
      + "<p class='muted'>Nada queda registrado en este sitio. Las peticiones van sólo a api.github.com y el token es revocable desde GitHub en cualquier momento.</p>"
      + "</div>";
    ["rp","tk"].forEach(function(id){
      document.getElementById(id).addEventListener("keydown", function(e){ if(e.key==="Enter") saveConfig(); });
    });
    document.getElementById("rp").focus();
    return;
  }

  if(view==="loading"){
    app.innerHTML = "<div class='load'><span class='spin'>"+IC.load+"</span> Cargando el brief…</div>";
    return;
  }

  if(view==="error"){
    const is404 = errMsg.indexOf("404")===0;
    app.innerHTML = "<div class='center'>"
      + "<h2>No se pudo cargar</h2>"
      + "<div class='ebox'>"+esc(errMsg)+"</div>"
      + (is404 ? "<p>Si el token es correcto, puede que aún no exista <code>"+BRIEF_PATH+"</code>. Pide a Claude «morning» para generarlo.</p>" : "")
      + "<div class='pbtns'><button class='lnk' onclick='changeToken()'>Cambiar token</button>"
      + "<button class='btn btn-p' onclick='loadBrief()'>Reintentar</button></div>"
      + "</div>";
    return;
  }

  // ready
  const items = BRIEF.items, meta = BRIEF.meta, calendar = BRIEF.calendar;
  const tasks   = items.filter(i=>i.type==="task");
  const people  = items.filter(i=>i.type==="person");
  const threads = items.filter(i=>i.type==="thread");
  const n = actions().length;

  let h = "<div class='wrap'>";
  h += "<div class='hdr'><div><h1>ops</h1><div class='hdr-date'>"
     + esc(new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}))
     + "</div></div><div class='hdr-r'>"
     + "<button class='btn btn-icon' onclick='loadBrief()' title='Recargar brief'>"+IC.refresh+"</button>"
     + "<button class='btn "+(n?"btn-p pulse":"")+"' onclick='runSync()' "+(n?"":"disabled")+">"
     + (n ? IC.up+" Sync ("+n+")" : IC.up+" Sync")
     + "</button></div></div>";

  if(BRIEF.date !== TODAY){
    h += "<div class='warn'>"+IC.warn+" El brief es del "+fd(BRIEF.date)+". Pide «morning» a Claude para actualizarlo.</div>";
  }
  meta.warnings.forEach(function(w){ h += "<div class='warn'>"+IC.warn+" "+esc(w)+"</div>"; });
  if(meta.summary) h += "<div class='summary'>"+esc(meta.summary)+"</div>";

  if(calendar.length){
    h += "<div class='sec'><div class='sec-hdr'><span class='sec-label'>Hoy</span></div><div class='cal-list'>";
    h += calendar.map(e=>"<div class='cal-row'><span class='cal-time'>"+(e.allDay?"":esc(e.time))+"</span><span class='cal-ev'>"+esc(e.title)+"</span>"+(e.allDay?"<span class='cal-ad'>todo el día</span>":"")+"</div>").join("");
    h += "</div></div>";
  }

  h += "<div class='sec'><div class='sec-hdr'><span class='sec-label'>Tasks</span>"
     + "<button class='sec-add' onclick='showNF=!showNF;render()'>"+IC.plus+" nueva task</button></div>";
  if(showNF){
    h += "<div class='nform'>"
      + "<div class='field'><label>Título</label><input id='nt-t' type='text' placeholder='Admin — enviar X'></div>"
      + "<div class='grid'>"
      + "<div class='field'><label>Topic</label><select id='nt-tp'>"+TOPICS.map(t=>"<option>"+t+"</option>").join("")+"</select></div>"
      + "<div class='field'><label>Fecha límite</label><input id='nt-d' type='date' value='"+TODAY+"'></div>"
      + "</div>"
      + "<div class='field'><label>Nota (opcional)</label><textarea id='nt-n' placeholder='Contexto…'></textarea></div>"
      + "<p class='err' id='nt-err'></p>"
      + "<div class='pbtns' style='margin-top:8px'><button class='btn' onclick='showNF=false;render()'>Cancelar</button>"
      + "<button class='btn btn-p' onclick='addTask()'>Añadir</button></div></div>";
  }
  h += tasks.map(card).join("");
  h += S.nt.map(function(t,i){
    const c = TC[t.topic]||{bg:"#eee",tx:"#555"};
    return "<div class='card isnew'><div class='card-row'><span class='card-title'>"+esc(t.title)+"</span>"
      + "<div class='acts'><button class='act rm' onclick='rmTask("+i+")'>"+IC.x+"</button></div></div>"
      + "<div class='card-meta'><span class='tag' style='background:"+c.bg+";color:"+c.tx+"'>"+esc(t.topic)+"</span>"
      + (t.due?"<span class='chip'>"+fd(t.due)+"</span>":"")
      + "<span class='chip new'>nueva</span></div>"
      + (t.note?"<div class='cnote'>"+esc(t.note)+"</div>":"")+"</div>";
  }).join("");
  h += "</div>";

  if(people.length){
    h += "<div class='sec'><div class='sec-hdr'><span class='sec-label'>People</span></div>"+people.map(card).join("")+"</div>";
  }
  if(threads.length){
    h += "<div class='sec'><div class='sec-hdr'><span class='sec-label'>Projects & threads</span></div>"+threads.map(card).join("")+"</div>";
  }

  h += "<div class='foot'><span>brief "+esc(BRIEF.date)+(lastLoad?" · cargado "+hhmm(lastLoad):"")+"</span>"
     + "<button class='lnk' onclick='changeToken()'>cambiar repo/token</button></div>";
  h += "</div>";

  app.innerHTML = h;
}

function card(item){
  const n = item.number, c = ch(n), p = panels[n]||{};
  const dd = c.newDate || item.due;
  const dcs = dc(dd);
  const done = !!c.done;
  const isTask = item.type==="task";
  const isPerson = item.type==="person";
  const dlabel = isPerson ? "Próximo seguimiento" : "Fecha límite";

  return "<div class='card "+dcs+(done?" done":"")+"'>"
    + "<div class='card-row'><span class='card-title"+(done?" struck":"")+"'>"+esc(item.title)+"</span>"
    + "<div class='acts'>"
    + (isTask?"<button class='act"+(done?" on-green":"")+"' onclick='setCh("+n+",{done:"+(!done)+"})' title='"+(done?"Deshacer":"Hecho")+"'>"+IC.check+"</button>":"")
    + "<button class='act"+(p.log?" on":"")+"' onclick='toggleP("+n+",\"log\")' title='Log'>"+IC.msg+"</button>"
    + "<button class='act"+(p.date?" on":"")+"' onclick='toggleP("+n+",\"date\")' title='"+dlabel+"'>"+IC.cal+"</button>"
    + "<a class='act' href='"+esc(item.url)+"' target='_blank' rel='noopener' title='GitHub'>"+IC.ext+"</a>"
    + "</div></div>"
    + "<div class='card-meta'>"+ttag(item.topic)
    + (dd?"<span class='chip "+dcs+"'>"+(dcs==="overdue"?"atrasado · ":"")+fd(dd)+(c.newDate?" ✓":"")+"</span>":"")
    + (c.log?"<span class='chip logged'>"+IC.msg+" log</span>":"")
    + "</div>"
    + (item.note?"<div class='cnote'>"+esc(item.note)+"</div>":"")
    + (p.log?"<div class='panel'><textarea id='lt-"+n+"' placeholder='Nota de reunión…'>"+esc(c.log||"")+"</textarea>"
        + "<div class='pbtns'><button class='btn' onclick='toggleP("+n+",\"log\")'>Cancelar</button>"
        + "<button class='btn btn-p' onclick='saveLog("+n+")'>Guardar</button></div></div>":"")
    + (p.date?"<div class='panel'><div class='pfield'><label>"+dlabel+"</label>"
        + "<input type='date' id='dt-"+n+"' value='"+(dd||"")+"'></div>"
        + "<div class='pbtns'><button class='btn' onclick='toggleP("+n+",\"date\")'>Cancelar</button>"
        + "<button class='btn btn-p' onclick='saveDate("+n+")'>Fijar</button></div></div>":"")
    + "</div>";
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById("overlay").addEventListener("click", function(e){
  if(e.target.id==="overlay") closeModal();
});
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && view==="ready" && lastLoad && (Date.now()-lastLoad.getTime())>600000) loadBrief();
});
loadBrief();
</script>
